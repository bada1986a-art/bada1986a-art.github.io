  } else {
    html += '<div class="field"><div class="field-label">새 비밀번호 (4자리)</div><input class="input num" id="pinNew" type="tel" inputmode="numeric" maxlength="4" placeholder="예: 1234"></div>' +
      '<div class="field"><div class="field-label">한 번 더</div><input class="input num" id="pinNew2" type="tel" inputmode="numeric" maxlength="4" placeholder="같은 숫자"></div>' +
      '<div class="field"><div class="field-label">힌트 (선택)</div><input class="input" id="pinHint" placeholder="예: 아이들 생일"></div>' +
      '<div class="actions"><button class="btn" data-act="closeModal">취소</button>' +
        '<button class="btn main" data-act="pinSave">켜기</button></div>';
  }
  html += '<p class="seg-note" style="text-align:left;margin-top:12px">비밀번호를 잊으면 기록에 들어갈 수 없어요.<br>힌트를 꼭 남겨 주세요.</p>';
  openModal(html);
}

/* ---------- v4 동작 ---------- */
function onActionV4(act, el){
  var d = el.dataset || {};
  switch(act){
    /* 배너 */
    case 'bannerToggle':
      S.bannerClosed = !S.bannerClosed; save();
      if (S.tab === 'home') render();
      return true;

    /* 가족 상태 */
    case 'statusChange': openStatusModal(d.m); return true;
    case 'statusPick': {
      statusPick = { emoji: d.e, text: d.t };
      var row = el.parentNode;
      Array.prototype.forEach.call(row.children, function(b){ b.classList.remove('on'); });
      el.classList.add('on');
      var cu = document.getElementById('stCustom');
      if (cu) cu.value = '';
      return true;
    }
    case 'statusSave': saveStatus(); return true;

    /* 전화 */
    case 'phoneSetup': phoneReturn = d.from === 'settings' ? 'settings' : ''; openPhoneModal(d.m); return true;
    case 'phoneSave': {
      var num = ((document.getElementById('phNum') || {}).value || '').trim();
      if (num && num.replace(/[^0-9]/g, '').length < 7){
        toast('전화번호를 다시 확인해 주세요');
        return true;
      }
      if (!S.phones) S.phones = {};
      S.phones[d.m] = num;
      saveNow(); closeModal(); render();
      if (phoneReturn === 'settings'){ phoneReturn = ''; openSettings(); }
      toast(num ? memberById(d.m).title + ' 번호를 저장했어요' : '번호를 지웠어요');
      return true;
    }
    case 'callLog':
      recordCall(d.m);
      return true;           /* tel: 링크는 브라우저가 열도록 두기 */
    case 'callLogClear':
      S.calls = []; saveNow(); openSettings(); toast('통화 기록을 지웠어요');
      return true;

    /* 알림 */
    case 'notifCenter': openNotifCenter(); return true;
    case 'notifToggle': {
      var k = d.k;
      S.notif.settings[k] = !S.notif.settings[k];
      saveNow(); openNotifCenter();
      return true;
    }
    case 'notifMember': {
      var mm = d.m;
      S.notif.members[mm] = (S.notif.members[mm] === false);
      saveNow(); openNotifCenter();
      return true;
    }
    case 'notifGo': {
      S.notif.read[d.id] = true;
      var keys = Object.keys(S.notif.read);
      if (keys.length > 300) keys.slice(0, keys.length - 300).forEach(function(x){ delete S.notif.read[x]; });
      S.tab = d.tab || 'home';
      saveNow(); closeModal(); render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return true;
    }
    case 'notifAllRead': {
      notifItems().forEach(function(it){ S.notif.read[it.id] = true; });
      saveNow(); openNotifCenter(); paintBadge();
      toast('모두 읽음으로 표시했어요');
      return true;
    }

    /* 루틴 고정 필터 */
    case 'routineFilter':
      S.ui.routineFilter = d.v === 'pinned' ? 'pinned' : 'all';
      save(); render();
      return true;

    /* 일정 달력 */
    case 'planPrev': S.planCal.offset = (S.planCal.offset || 0) - 1; save(); render(); return true;
    case 'planNext': S.planCal.offset = (S.planCal.offset || 0) + 1; save(); render(); return true;
    case 'planPick': {
      var kk = d.d || '';
      S.planCal.sel = (S.planCal.sel === kk) ? '' : kk;
      save(); render();
      return true;
    }
    case 'eventAdd': {
      var sel = S.planCal && S.planCal.sel;
      openEventModal(null, sel || undefined);
      return true;
    }
    case 'eventStar': {
      var ev = findEvent(d.id);
      if (ev){ ev.important = !ev.important; saveNow(); render(); toast(ev.important ? '중요 일정으로 표시했어요 ⭐' : '중요 표시를 풀었어요'); }
      return true;
    }
    case 'evImp': {
      evImportant = !evImportant;
      el.style.background = evImportant ? '#FFF3DC' : '';
      el.style.borderColor = evImportant ? '#EFCB80' : '';
      el.style.color = evImportant ? '#8A6414' : '';
      el.textContent = evImportant ? '⭐ 중요' : '☆ 보통';
      return true;
    }

    /* 식사 */
    case 'mealGo': {
      var day = addDays(new Date(), +d.d || 0);
      S.mealDate = dateKey(day);
      save(); render();
      return true;
    }
    case 'mealToggle': {
      var md = mealDayObj(mealKey());
      md.items.forEach(function(it){ if (it.id === d.id) it.checked = !it.checked; });
      save(); render(); buzz(8);
      return true;
    }
    case 'mealAll': {
      var md2 = mealDayObj(mealKey());
      var allOn = md2.items.length && md2.items.every(function(it){ return it.checked; });
      md2.items.forEach(function(it){ it.checked = !allOn; });
      save(); render();
      if (!allOn){ buzz(14); celebrate('🍚'); toast('오늘 메뉴를 다 먹었어요! 🍚'); }
      return true;
    }
    case 'algToggle':
      S.ui.algOpen = !S.ui.algOpen; save(); render();
      return true;
    case 'mealEdit': openMealEdit(); return true;
    case 'mealEditAdd':
      collectMealEdit(); mealEditState.items.push({ id:'', text:'', allergy:'', checked:false });
      drawMealEdit();
      return true;
    case 'mealEditDel':
      collectMealEdit();
      mealEditState.items.splice(+d.i, 1);
      if (!mealEditState.items.length) mealEditState.items.push({ id:'', text:'', allergy:'', checked:false });
      drawMealEdit();
      return true;
    case 'mealEditSave': saveMealEdit(); return true;

    /* 데이터 보호 */
    case 'pinManage': openPinManage(); return true;
    case 'pinSave': {
      var cur = ((document.getElementById('pinCur') || {}).value || '').trim();
      var nw = ((document.getElementById('pinNew') || {}).value || '').trim();
      var nw2 = ((document.getElementById('pinNew2') || {}).value || '').trim();
      var hint = ((document.getElementById('pinHint') || {}).value || '').trim();
      if (!/^\d{4}$/.test(nw)){ toast('비밀번호는 숫자 4자리로 정해 주세요'); return true; }
      if (S.security.pin){
        if (pinHash(cur) !== S.security.pin){ toast('지금 비밀번호가 맞지 않아요'); return true; }
      } else if (nw !== nw2){
        toast('두 번 적은 비밀번호가 달라요'); return true;
      }
      S.security.pin = pinHash(nw);
      S.security.hint = hint;
      saveNow(); closeModal(); openSettings();
      toast('화면 비밀번호를 켰어요 🔒');
      return true;
    }
    case 'pinOff': {
      var c0 = ((document.getElementById('pinCur') || {}).value || '').trim();
      if (pinHash(c0) !== S.security.pin){ toast('지금 비밀번호가 맞지 않아요'); return true; }
      S.security.pin = ''; S.security.hint = '';
      saveNow(); closeModal(); openSettings();
      toast('화면 비밀번호를 껐어요');
      return true;
    }
    case 'kidLock': {
      S.security.kidLock = !S.security.kidLock;
      if (!S.security.kidLock) adultPassUntil = 0;
      saveNow(); openSettings();
      toast(S.security.kidLock ? '하람·이솔 기기로 잠갔어요 🔒' : '아이 기기 잠금을 풀었어요');
      return true;
    }
    case 'saveNow':
      saveNow(); openSettings(); toast('지금 저장했어요 · ' + savedTimeLabel());
      return true;
    case 'pinKey': pinKey(d.k); return true;
    case 'adultYes': {
      adultPassUntil = Date.now() + 5 * 60 * 1000;
      var pend2 = pinPending; pinPending = null;
      closeModal();
      toast('어른 확인 완료 · 5분 동안 바꿀 수 있어요');
      if (pend2) onAction(pend2.act, { dataset: pend2.ds, classList: { contains: function(){ return false; } }, parentNode: null });
      return true;
    }
    case 'pinForgot':
      openModal('<h3>비밀번호를 잊으셨나요?</h3>' +
        '<p class="hint">이 비밀번호는 기기 안에만 저장되어 저희도 알 수 없어요.<br>' + (S.security.hint ? '힌트: ' + esc(S.security.hint) : '힌트를 남기지 않으셨어요.') + '<br><br>방법이 없을 때는 백업 파일이 있다면 새로 시작한 뒤 불러올 수 있어요. 기록이 지워질 수 있으니 신중하게 결정해 주세요.</p>' +
        '<div class="actions"><button class="btn block" data-act="closeModal">다시 해 볼게요</button></div>');
      return true;
  }
  return false;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function findTodo(m, id){ var out = null; (S.todos[m] || []).forEach(function(t){ if (t.id === id) out = t; }); return out; }
function findRoutine(kid, id){ var out = null; (S.routines[kid] || []).forEach(function(it){ if (it.id === id) out = it; }); return out; }

function onAction(act, el){
  if (needAdult(act)){
    pinPending = { act: act, ds: el.dataset ? JSON.parse(JSON.stringify(el.dataset)) : {} };
    openAdultCheck();
    return;
  }
  if (onActionV4(act, el)) return;
  var d = el.dataset || {};
  switch(act){
    case 'mealSave':
      saveNow(); render(); toast('오늘 식사를 저장했어요');
      return;
    case 'tab':
      if (S.tab === d.tab) return;
      S.tab = d.tab;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      buzz(8);
      return;

    case 'settings': openSettings(); return;
    /* 시트 안쪽(내용·입력창)을 눌러도 모달이 닫히지 않게 */
    case 'sheet': return;
    case 'overlay':
      if (el.classList.contains('overlay')) closeModal();
      return;

    /* --- 카톡 공유 --- */
    case 'share': openShareModal(); return;
    case 'shareCopy':
      copyAndToast(shareTextValue(), '카톡에 붙여넣기 할 수 있게 복사했어요!');
      return;
    case 'shareSend': {
      var shareBody = shareTextValue();
      if (navigator.share){
        try {
          navigator.share({ title: '우리 가족 기록장', text: shareBody }).then(function(){
            toast('공유했어요');
          }, function(err){
            if (err && err.name === 'AbortError') return;
            copyAndToast(shareBody, '공유 창이 열리지 않아 복사했어요. 카톡에 붙여넣어 주세요!');
          });
          return;
        } catch(e){ /* 공유를 못 쓰는 브라우저 → 복사로 */ }
      }
      copyAndToast(shareBody, '이 브라우저에서는 앱 공유가 안 돼서 복사했어요. 카톡에 붙여넣어 주세요!');
      return;
    }
    case 'closeModal': closeModal(); return;

    /* --- to-do --- */
    case 'todoToggle': {
      var t = findTodo(d.m, d.id);
      if (t){ t.done = !t.done; if (t.done) buzz(10); }
      render();
      return;
    }
    case 'todoAdd': openTodoModal(d.m); return;
    case 'todoEdit': openTodoModal(d.m, d.id); return;
    case 'modalWho': {
      modalWho = d.m;
      var row = el.parentNode;
      Array.prototype.forEach.call(row.children, function(b){ b.classList.remove('on'); });
      el.classList.add('on');
      return;
    }
    case 'todoSave': {
      var text = (document.getElementById('todoText') || {}).value || '';
      text = text.trim();
      if (!text){ toast('할 일 내용을 적어 주세요'); return; }
      if (d.id){
        // move between members if the owner changed
        var found = null, from = null;
        MEMBERS.forEach(function(m){
          (S.todos[m.id] || []).forEach(function(x, i){
            if (x.id === d.id){ found = x; from = m.id; }
          });
        });
        if (found){
          found.text = text;
          if (from !== modalWho){
            S.todos[from] = S.todos[from].filter(function(x){ return x.id !== d.id; });
            S.todos[modalWho].push(found);
          }
        }
      } else {
        S.todos[modalWho].push({ id: uid(), text: text, done: false });
      }
      saveNow(); closeModal(); render(); toast('할 일을 저장했어요');
      return;
    }
    case 'todoDel': {
      S.todos[d.m] = (S.todos[d.m] || []).filter(function(x){ return x.id !== d.id; });
      saveNow(); render(); toast('할 일을 지웠어요');
      return;
    }

    /* --- 루틴 --- */
    case 'routineKid':
      S.ui.routineKid = d.kid; save(); render(); return;

    case 'routineToggle': {
      var kid = d.kid;
      var it = findRoutine(kid, d.id);
      if (!it) return;
      var key = todayKey();
      var before = routineDoneCount(kid);
      if (!S.checks[kid]) S.checks[kid] = {};
      if (!S.checks[kid][key]) S.checks[kid][key] = {};
      var on = !!S.checks[kid][key][d.id];
      if (on){ delete S.checks[kid][key][d.id]; }
      else { S.checks[kid][key][d.id] = true; }
      saveNow();
      render();
      if (!on){
        buzz(14);
        var after = routineDoneCount(kid);
        if (before === 0 && after > 0){
          celebrate('🐶');
          toast(memberById(kid).title + ' 도장 찍혔어요! ' + won(rewardAmt()) + '도 쌓였어요 🎉');
        } else {
          toast(memberById(kid).title + ' +' + won(rewardAmt()) + ' 적립 · ' + after + '/' + routineItems(kid).length + '개 완료');
        }
      } else {
        toast(won(rewardAmt()) + ' 적립을 취소했어요');
      }
      return;
    }
    case 'routinePin': {
      var pin = findRoutine(d.kid, d.id);
      if (pin){ pin.pinned = !pin.pinned; saveNow(); render(); }
      return;
    }
    case 'routineAdd': openRoutineModal(); return;
    case 'routineEdit': openRoutineModal(d.id); return;
    case 'routineSave': {
      var rt = (document.getElementById('rtText') || {}).value || '';
      var note = (document.getElementById('rtNote') || {}).value || '';
      rt = rt.trim(); note = note.trim();
      if (!rt){ toast('루틴 이름을 적어 주세요'); return; }
      var kk = S.ui.routineKid;
      if (d.id){
        var ed = findRoutine(kk, d.id);
        if (ed){ ed.text = rt; ed.note = note; }
      } else {
        S.routines[kk].push({ id: uid(), text: rt, note: note, pinned: false });
      }
      saveNow(); closeModal(); render(); toast('루틴을 저장했어요');
      return;
    }
    case 'routineDel': {
      var kid2 = d.kid;
      S.routines[kid2] = (S.routines[kid2] || []).filter(function(x){ return x.id !== d.id; });
      Object.keys(S.checks[kid2] || {}).forEach(function(k){
        if (S.checks[kid2][k]) delete S.checks[kid2][k][d.id];
      });
      saveNow(); render(); toast('루틴을 지웠어요');
      return;
    }
    case 'goMoney':
      S.tab = 'money'; S.ui.moneyKid = d.kid; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      return;

    /* --- 도장판 달력 --- */
    case 'stampCal': openCalendar(d.kid); return;
    case 'calPrev': calOffset--; drawCalendar(); return;
    case 'calNext': calOffset++; drawCalendar(); return;

    /* --- 미션 --- */
    case 'missionDone': {
      var k = todayKey();
      if (S.mission.done[k]){
        delete S.mission.done[k];
        S.mission.count = Math.max(0, S.mission.count - 1);
        saveNow(); render(); toast('오늘 미션 기록을 취소했어요');
      } else {
        S.mission.done[k] = true;
        S.mission.count++;
        saveNow(); render();
        buzz(18); celebrate('🎉');
        toast('우리 가족 미션 완료! 함께 ' + S.mission.count + '번째예요 🎉');
      }
      return;
    }
    case 'missionShuffle': {
      var pool = MISSIONS.filter(function(x){ return x.title !== S.mission.title; });
      var pick = pool[Math.floor(Math.random() * pool.length)] || MISSIONS[0];
      S.mission.emoji = pick.emoji;
      S.mission.title = pick.title;
      saveNow(); render();
      buzz(12);
      toast('오늘의 미션: ' + pick.title);
      return;
    }

    /* --- 용돈 --- */
    case 'moneyKid': S.ui.moneyKid = d.kid; save(); render(); return;
    case 'moneyAdd': openMoneyModal(d.kid, d.type); return;
    case 'moneySave': {
      var amt = +(document.getElementById('mvAmount') || {}).value || 0;
      var memo = ((document.getElementById('mvMemo') || {}).value || '').trim();
      if (amt <= 0){ toast('금액을 적어 주세요'); return; }
      var entry = { id: uid(), amount: amt, memo: memo, date: (new Date().getMonth()+1) + '/' + new Date().getDate(), ts: Date.now() };
      var arr = d.type === 'deposit' ? S.allowance[d.kid].deposit : S.allowance[d.kid].spend;
      arr.push(entry);
      saveNow(); closeModal(); render();
      toast((d.type === 'deposit' ? '입금 ' : '사용 ') + won(amt) + '을 기록했어요');
      return;
    }
    case 'moneyDel': {
      var typ = d.type === 'deposit' ? 'deposit' : 'spend';
      S.allowance[d.kid][typ] = S.allowance[d.kid][typ].filter(function(x){ return x.id !== d.id; });
      saveNow(); render(); toast('기록을 지웠어요');
      return;
    }

    /* --- 일정 --- */
    case 'eventAdd': openEventModal(); return;
    case 'eventEdit': openEventModal(d.id); return;
    case 'eventSave': {
      var title = ((document.getElementById('evTitle') || {}).value || '').trim();
      var date = (document.getElementById('evDate') || {}).value || todayKey();
      var endRaw = (document.getElementById('evEnd') || {}).value || '';
      var time = (document.getElementById('evTime') || {}).value || '';
      var note = ((document.getElementById('evNote') || {}).value || '').trim();
      if (!title){ toast('일정 내용을 적어 주세요'); return; }
      if (endRaw && endRaw < date){ toast('종료일은 시작일보다 뒤로 정해 주세요'); return; }
      if (d.id){
        var ev = findEvent(d.id);
        if (!ev){ toast('일정을 찾을 수 없어요'); closeModal(); render(); return; }
        ev.title = title; ev.date = date; ev.time = time; ev.note = note; ev.who = modalWho || '';
        ev.endDate = endRaw || '';
        ev.important = !!evImportant;
      } else {
        S.events.push({ id: uid(), title: title, date: date, endDate: endRaw || '', time: time, note: note,
          who: modalWho || '', important: !!evImportant });
      }
      planGoto(date);
      saveNow(); closeModal();
      S.tab = 'plan'; render();
      toast(d.id ? '일정을 저장했어요' : '일정을 추가했어요');
      return;
    }
    case 'eventDel':
      S.events = S.events.filter(function(e){ return e.id !== d.id; });
      saveNow(); render(); toast('일정을 지웠어요');
      return;

    /* --- 건강 --- */
    case 'healthToggle': {
      var hk = todayKey();
      if (!S.health[hk]) S.health[hk] = {};
      if (!S.health[hk][d.kid]) S.health[hk][d.kid] = {};
      var rec = S.health[hk][d.kid];
      rec[d.f] = !rec[d.f];
      saveNow(); render(); buzz(8);
      return;
    }
    case 'healthSleep': {
      var hk2 = todayKey();
      if (!S.health[hk2]) S.health[hk2] = {};
      if (!S.health[hk2][d.kid]) S.health[hk2][d.kid] = {};
      var r2 = S.health[hk2][d.kid];
      var cur = r2.sleep == null ? 9 : +r2.sleep;
      r2.sleep = Math.min(16, Math.max(0, cur + (+d.d)));
      saveNow(); render();
      return;
    }
    case 'healthMood': {
      var hk3 = todayKey();
      if (!S.health[hk3]) S.health[hk3] = {};
      if (!S.health[hk3][d.kid]) S.health[hk3][d.kid] = {};
      var r3 = S.health[hk3][d.kid];
      r3.mood = (r3.mood === d.v) ? '' : d.v;
      saveNow(); render();
      return;
    }

    /* --- 칭찬 --- */
    case 'praiseWho': S.ui.praiseTo = d.id; save(); render(); return;
    case 'praiseSticker': S.ui.praiseSticker = d.v; save(); render(); return;
    case 'praiseSend': {
      var box = document.getElementById('praiseMsg');
      var msg = ((box && box.value) || '').trim();
      if (!msg){ toast('칭찬 내용을 적어 주세요'); if (box) box.focus(); return; }
      var now = new Date();
      S.praise.push({ id: uid(), to: S.ui.praiseTo, sticker: S.ui.praiseSticker, msg: msg, date: (now.getMonth()+1) + '/' + now.getDate(), ts: Date.now() });
      saveNow(); render(); buzz(12); celebrate('💖');
      toast(memberById(S.ui.praiseTo).title + '에게 칭찬을 남겼어요 💝');
      return;
    }
    case 'praiseDel':
      S.praise = S.praise.filter(function(p){ return p.id !== d.id; });
      saveNow(); render(); toast('칭찬 카드를 지웠어요');
      return;

    /* --- 메모 --- */
    case 'memoWho': S.ui.memoWho = d.id; save(); render(); return;
    case 'memoSend': {
      var ta = document.getElementById('memoText');
      var txt = ((ta && ta.value) || '').trim();
      if (!txt){ if (ta) ta.focus(); return; }
      S.memos.push({ id: uid(), who: S.ui.memoWho, text: txt, ts: Date.now() });
      saveNow(); render(); buzz(8);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return;
    }
    case 'memoSticker':
      S.memos.push({ id: uid(), who: S.ui.memoWho, sticker: d.v, ts: Date.now() });
      saveNow(); render(); buzz(8);
      return;
    case 'memoEdit': openMemoEditModal(d.id); return;
    case 'memoEditWho': {
      memoEditWho = d.m;
      var mrow = el.parentNode;
      Array.prototype.forEach.call(mrow.children, function(b){ b.classList.remove('on'); });
      el.classList.add('on');
      return;
    }
    case 'memoEditSticker': {
      memoEditSticker = d.v;
      var srow = el.parentNode;
      Array.prototype.forEach.call(srow.children, function(b){ b.classList.remove('on'); });
      el.classList.add('on');
      return;
    }
    case 'memoSave': {
      var emsg = null;
      (S.memos || []).forEach(function(x){ if (x.id === d.id) emsg = x; });
      if (!emsg){ toast('메모를 찾을 수 없어요'); closeModal(); render(); return; }
      if (emsg.sticker){
        emsg.sticker = memoEditSticker || emsg.sticker;
      } else {
        var eta = document.getElementById('memoEditText');
        var etxt = ((eta && eta.value) || '').trim();
        if (!etxt){ toast('메모 내용을 적어 주세요'); if (eta) eta.focus(); return; }
        emsg.text = etxt;
      }
      emsg.who = memoEditWho || emsg.who;
      saveNow(); closeModal(); render(); toast('메모를 저장했어요');
      return;
    }
    case 'memoHeart': {
      (S.memos || []).forEach(function(msg){ if (msg.id === d.id) msg.liked = !msg.liked; });
      saveNow(); render();
      return;
    }
    case 'memoDel':
      S.memos = S.memos.filter(function(msg){ return msg.id !== d.id; });
      saveNow(); render(); toast('메모를 지웠어요');
      return;

    /* --- 설정 --- */
    case 'rewardPreset': {
      var pv = Math.round(+d.v || 0);
      if (pv > 0){
        S.reward = Math.min(pv, 1000000);
        saveNow();
        render();
        openSettings();
        toast('루틴 용돈을 ' + won(rewardAmt()) + '으로 바꿨어요');
      }
      return;
    }
    case 'backup': {
      try {
        var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var t = new Date();
        a.href = url;
        a.download = '우리-가족-기록장-백업-' + dateKey(t) + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1200);
        toast('백업 파일을 저장했어요');
      } catch(e){ toast('백업 파일을 만들 수 없어요'); }
      return;
    }
    case 'restore': {
      var inp = document.getElementById('restoreFile');
      if (inp) inp.click();
      return;
    }
    case 'reset': openReset(); return;
    case 'resetConfirm': {
      S = freshState();
      saveNow(); closeModal(); render();
      toast('처음부터 다시 시작해요');
      return;
    }
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act;
  /* tel: 링크는 브라우저가 전화앱을 열도록 그대로 둡니다 */
  if (act === 'callLog'){ onAction(act, el); return; }
  e.preventDefault();
  onAction(act, el);
});

/* inputs */
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.dataset || !el.dataset.act) return;
  if (kidLocked() && (el.dataset.act === 'startMoney' || el.dataset.act === 'rewardInput')){
    toast('아이 기기로 잠겨 있어요 · 어른 확인이 필요해요');
    return;
  }
  if (el.dataset.act === 'mealMemo'){
    var mk = mealKey();
    var mo = mealDayObj(mk);
    mo.memo = el.value;
    save();
  }
  if (el.dataset.act === 'startMoney'){
    var v = Math.max(0, +el.value || 0);
    S.allowance[el.dataset.kid].start = v;
    save();
  }
  if (el.dataset.act === 'rewardInput'){
    var rv = Math.min(Math.round(+el.value || 0), 1000000);
    if (rv > 0){ S.reward = rv; save(); }
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.dataset) return;
  if (el.dataset.act === 'startMoney'){
    saveNow(); render();
  }
  if (el.dataset.act === 'mealMemo'){
    saveNow();
  }
  if (el.dataset.act === 'rewardInput'){
    var rv = Math.round(+el.value || 0);
    if (!(rv > 0)) rv = REWARD_DEFAULT;
    if (rv > 1000000) rv = 1000000;
    S.reward = rv;
    saveNow(); render();
    toast('루틴 용돈을 ' + won(rewardAmt()) + '으로 바꿨어요');
    /* blur 처리 중에 모달을 다시 그리면 브라우저가 예외를 던져서 다음 차례로 미룹니다. */
    setTimeout(function(){
      var root = document.getElementById('modalRoot');
      if (root && root.querySelector('[data-act="rewardInput"]')) openSettings();
    }, 0);
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    var ta = document.getElementById('memoText');
    if (ta && document.activeElement === ta){
      e.preventDefault();
      var btn = document.querySelector('[data-act="memoSend"]');
      if (btn) btn.click();
    }
  }
});

/* hidden restore input */
(function(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.id = 'restoreFile';
  inp.style.display = 'none';
  inp.addEventListener('change', function(){
    var file = inp.files && inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(String(reader.result));
        S = mergeDefaults(data);
        saveNow(); closeModal(); render();
        toast('백업을 불러왔어요');
      } catch(err){
        toast('백업 파일을 읽을 수 없어요');
      }
    };
    reader.readAsText(file);
    inp.value = '';
  });
  document.body.appendChild(inp);
})();

/* brand mark */
document.getElementById('brandMark').innerHTML = avatarSVG('haram');

/* boot */
probeStorage();
load();
if (!S.tab) S.tab = 'home';
/* 지난번에 보던 날짜·달력 위치는 남기지 않고 오늘로 시작합니다. */
S.mealDate = '';
S.planCal = { offset: 0, sel: '' };
if (S.security && S.security.pin){
  /* 비밀번호가 켜져 있으면 먼저 잠금 화면을 보여 줍니다 */
  showLockScreen();
  paintBadge();
} else {
  render();
}
startClock();
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveNow(); });
})();
</script>

/* PWA: offline cache + installable */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
