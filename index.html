<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족기록장">
<meta name="description" content="우리 가족의 하루를 한 곳에 모으는 기록장">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>우리 가족 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:light;
  --bg:#FFFDF5;
  --card:#FFFEFA;
  --ink:#4B3B2E;
  --ink2:#6E5B49;
  --muted:#A5957F;
  --muted2:#BFB09B;
  --line:#F1E6D2;
  --line2:#EBDFC8;
  --pink:#FFD3E1;
  --pink-2:#FFE9F1;
  --pink-ink:#E4739A;
  --mint:#CFEFDC;
  --mint-2:#E9F8F0;
  --mint-ink:#3F9E72;
  --blue:#C9E5FB;
  --blue-2:#E9F5FE;
  --blue-ink:#4C90C9;
  --yellow:#FFE7A3;
  --yellow-2:#FFF7DC;
  --yellow-ink:#B98B20;
  --peach:#FFE0C8;
  --shadow:0 8px 24px rgba(197,166,118,.13);
  --shadow-sm:0 3px 12px rgba(197,166,118,.10);
  --r:26px;
  --r-sm:18px;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-title:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(120% 60% at 50% -10%, #FFF8D9 0%, rgba(255,248,217,0) 60%),
    radial-gradient(80% 40% at 100% 0%, #FFF1F5 0%, rgba(255,241,245,0) 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
  font-size:15px;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted2)}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

.app{max-width:480px;margin:0 auto;padding:0 14px 112px;position:relative;min-height:100vh}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:flex-start;gap:10px;
  padding:14px 2px 10px;
  background:linear-gradient(180deg,rgba(255,253,245,.98) 62%,rgba(255,253,245,0));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-top:6px}
.brand .mark{width:38px;height:38px;flex:0 0 auto}
.brand h1{font-family:var(--font-title);font-size:26px;line-height:1.1;letter-spacing:-.4px;font-weight:400;white-space:nowrap}
.brand h1 .brown{color:#9A6C4A}
.brand h1 .pink{color:#EE8FAF}
.top-actions{display:flex;gap:8px;flex:0 0 auto}
.icon-btn{
  width:46px;height:46px;border-radius:50%;
  background:#fff;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);transition:transform .12s ease;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:21px;height:21px}
.share-btn{
  height:46px;padding:0 13px;border-radius:23px;
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#FFF5CE,#FFE7A3);border:1.5px solid #F0D071;
  color:#8A6414;font-weight:800;font-size:13.5px;letter-spacing:-.2px;white-space:nowrap;
  box-shadow:0 3px 12px rgba(230,190,90,.30);transition:transform .12s ease;
}
.share-btn:active{transform:scale(.94)}
.share-btn .s-ic{font-size:15px;line-height:1}
.dateline{padding:0 2px 12px;color:var(--muted);font-size:13.5px;line-height:1.35}
.dateline b{color:var(--ink2);font-weight:700}
.dateline .sub{color:var(--muted2)}

/* ---------- generic ---------- */
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px;
}
.card.pink{background:radial-gradient(130px 130px at 94% 2%,rgba(255,214,232,.75),rgba(255,214,232,0) 72%),linear-gradient(150deg,#FFF6F9 0%,#FFF3E9 52%,#FDF6E8 100%);border-color:#F7E3DC}
.card.mint{background:linear-gradient(150deg,#F3FBF6 0%,#F1FAF9 100%);border-color:#DCEEE4}
.card.blue{background:linear-gradient(150deg,#F5FAFF 0%,#F2F9FF 100%);border-color:#DDECF8}
.card.yellow{background:linear-gradient(150deg,#FFFBEB 0%,#FFF8E0 100%);border-color:#F6E9C6}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec-title .em{font-size:17px;line-height:1}
.sec-sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px;line-height:1.4}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;
  background:#fff;border:1.5px solid var(--line);color:var(--ink2);white-space:nowrap;
}
.pill.soft-yellow{background:var(--yellow-2);border-color:#F6E3AE;color:#A8791D}
.pill.soft-pink{background:var(--pink-2);border-color:#F8D3E0;color:var(--pink-ink)}
.pill.soft-mint{background:var(--mint-2);border-color:#CDEBD9;color:var(--mint-ink)}
.pill.soft-blue{background:var(--blue-2);border-color:#CDE6FB;color:var(--blue-ink)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:16px;padding:13px 16px;font-size:14.5px;font-weight:800;letter-spacing:-.2px;
  background:#fff;border:1.5px solid var(--line2);color:var(--ink2);
  box-shadow:var(--shadow-sm);transition:transform .12s ease,filter .12s ease;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.main{background:linear-gradient(180deg,#D8F2E1,#C6EBD6);border-color:#B2E2C6;color:#2E8F63}
.btn.grow{flex:1}
.btn.ghost{box-shadow:none;background:rgba(255,255,255,.7)}
.btn .ic{font-size:15px}
.dashed-add{
  width:100%;border:1.7px dashed var(--line2);border-radius:16px;padding:12px;
  color:#A98A66;font-weight:800;font-size:14px;background:rgba(255,255,255,.55);
}
.dashed-add:active{background:#FFF6E3}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px;line-height:1.6}

/* ---------- avatar ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:20px;background:#fff;flex:0 0 auto;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.av.tile{width:52px;height:52px;border:1.5px solid #F3EADB;box-shadow:0 3px 10px rgba(200,170,125,.12)}
.av.mini{width:26px;height:26px;border-radius:9px}

/* ---------- home member cards ---------- */
.member-card{
  display:flex;align-items:center;gap:13px;
  background:#fff;border:1.5px solid var(--line);border-radius:22px;
  padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:10px;
}
.member-card .av.tile{width:54px;height:54px}
.mc-body{flex:1;min-width:0}
.mc-name{font-size:19px;font-weight:800;letter-spacing:-.4px;color:#43342A;line-height:1.15}
.mc-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.mc-right{text-align:right;flex:0 0 auto}
.mc-star{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-weight:800;font-size:15px;color:#5B4A3C}
.mc-star .s{font-size:16px}
.mc-pig{font-size:12px;color:var(--pink-ink);font-weight:800;margin-top:1px;white-space:nowrap}
.mc-pig small{font-size:10px;color:var(--muted);font-weight:700}

/* ---------- stamp board ---------- */
.stamp-card{position:relative}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:12px 0 14px}
.week .day{display:flex;flex-direction:column;align-items:center;gap:6px}
.week .dow{font-size:11.5px;color:var(--muted);font-weight:700}
.week .sun{color:#D98B9B}
.slot{
  width:100%;aspect-ratio:1/1;max-width:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px dashed #E9DCC2;background:rgba(255,255,255,.5);
}
.slot.filled{border:0;background:transparent}
.slot.today{box-shadow:0 0 0 3px #fff,0 0 0 5.5px #9FD3F2}
.slot .stampimg{width:100%;height:100%}
.slot.future{opacity:.45}
.stamp-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stamp-foot .btn{flex:1;min-width:0}

/* ---------- mission ---------- */
.mission-emoji{font-size:38px;line-height:1;margin:10px 0 8px;display:block;filter:drop-shadow(0 4px 6px rgba(190,150,90,.18))}
.mission-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
.mission-actions{display:flex;gap:9px}
.mission-actions .btn{padding:14px 10px;font-size:15px}
.mission-note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}

/* ---------- to-do ---------- */
.todo-member{border-radius:22px;padding:13px 13px 11px;border:1.5px solid var(--line);background:#fff;margin-bottom:12px}
.todo-member.tone-pink{background:linear-gradient(160deg,#FFF9FB,#FFFDF8);border-color:#F6DFE5}
.todo-member.tone-mint{background:linear-gradient(160deg,#F7FCF9,#FFFDF8);border-color:#DCEFE3}
.todo-member.tone-blue{background:linear-gradient(160deg,#F8FBFF,#FFFDF8);border-color:#DEECF8}
.todo-member.tone-peach{background:linear-gradient(160deg,#FFF9F4,#FFFDF8);border-color:#F7E3D3}
.tm-head{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:1.5px dashed #EFE3CE}
.tm-head .av{width:40px;height:40px;border-radius:14px;border:1.5px solid #F4EBDC}
.tm-name{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.tm-prog{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px}
.todo-list{padding:2px 0 0}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed #F3E9D7}
.todo-item:last-child{border-bottom:0}
.chk{
  width:27px;height:27px;flex:0 0 auto;border-radius:9px;border:2px solid #D9CDB8;background:#fff;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.chk svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s ease}
.chk.on{background:#4CAF7D;border-color:#4CAF7D}
.chk.on svg{opacity:1;transform:scale(1)}
.todo-item .txt{flex:1;min-width:0;font-size:14.5px;line-height:1.35;word-break:break-word;transition:color .15s ease}
.todo-item.done .txt{color:#B9AB98;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#D9CDB8}
.mini-btns{display:flex;gap:6px;flex:0 0 auto}
.mini-btn{
  width:34px;height:34px;border-radius:11px;background:#fff;border:1.5px solid #F1E4CE;
  display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(200,170,125,.08);
}
.mini-btn:active{background:#FFF6E3}
.mini-btn.del{color:#D96B6B}
.mini-btn.pin.on{background:#FFE9A8;border-color:#F0D071}
.todo-add{margin-top:10px;width:100%;border:1.7px dashed #EBDCC2;border-radius:13px;padding:10px;color:#A6835C;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.6)}

/* ---------- switcher ---------- */
.switch{display:flex;gap:8px;margin-bottom:12px}
.switch button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 10px;border-radius:16px;border:1.7px solid #EFE3CE;background:#fff;
  font-weight:800;font-size:14px;color:#8E7C68;box-shadow:0 2px 8px rgba(200,170,125,.08);
  transition:all .15s ease;
}
.switch button .av{width:24px;height:24px;border-radius:8px;border:1px solid #EFE6D6}
.switch button.on{background:#FFF6DA;border-color:#F2CF7C;color:#8A6414;box-shadow:0 4px 14px rgba(230,190,90,.25)}

/* ---------- routine ---------- */
.routine-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.routine-head .av{width:48px;height:48px;border-radius:16px;border:1.5px solid #F0E5D3}
.rh-name{font-size:17px;font-weight:800;letter-spacing:-.3px}
.rh-prog{font-size:11.5px;color:var(--muted);font-weight:700}
.bar{height:9px;border-radius:999px;background:#F1ECDF;overflow:hidden;margin:4px 0 14px;border:1px solid #EFE7D6}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8FCDEB,#7FC6E6);transition:width .3s ease}
.bar.pink > i{background:linear-gradient(90deg,#FFB6CE,#F792B4)}
.routine-list .ritem{display:flex;align-items:flex-start;gap:9px;padding:11px 0;border-bottom:1.5px dashed #F1E7D5;flex-wrap:wrap}
.routine-list .ritem:last-child{border-bottom:0}
.routine-list .chk{background:#fff;border-color:#D9CDB8}
.routine-list .chk.blue{border-color:#CFDCD6}
.routine-list .chk.on{background:#7FBEE4;border-color:#7FBEE4}
.chip{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;
  font-size:11px;font-weight:800;background:#FFF4DE;color:#A8791D;border:1.2px solid #F4E2B6;
}
.chip.money{background:#FFF8E2;color:#A8791D}
.chip.green{background:#E9F8EF;color:#3E9E72;border-color:#CDEBD9}
.ritem .rtext{flex:1 1 120px;min-width:0;font-size:14.5px;word-break:break-word;line-height:1.35}
.ritem.done .rtext{color:#B9AB98;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#D9CDB8}
.ritem .meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ritem .meta .chip{font-size:10.5px;padding:2px 7px;gap:3px}
.ritem .chips{flex:0 0 auto;display:flex;gap:5px;align-items:center}
.ritem .btns{flex:0 0 auto;display:flex;gap:5px}
.routine-note{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.6}

/* ---------- allowance ---------- */
.balance-card{background:linear-gradient(160deg,#FFF8E9 0%,#FFF4F6 55%,#F6F9FF 100%);border:1.5px solid #F5E6D3;border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.bal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bal-label{font-size:13px;font-weight:800;color:#8E7A61}
.bal-num{font-family:var(--font-title);font-size:40px;line-height:1.05;color:#A9761A;letter-spacing:-1px;text-align:right;white-space:nowrap}
.bal-num small{font-size:19px;margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.chips .pill{background:rgba(255,255,255,.82)}
.chips .pill b{color:#8A6414}
.chips .pill.minus b{color:#C9656B}
.hr{border:0;border-top:1.5px dashed #EADCC4;margin:14px 0}
.field-label{font-size:12.5px;font-weight:800;color:#8E7A61;margin-bottom:6px}
.input{
  width:100%;border:1.5px solid #EBDFC9;border-radius:14px;padding:12px 13px;background:#fff;
  font-size:15px;outline:none;transition:border-color .15s ease,box-shadow .15s ease;
}
.input:focus{border-color:#E9C98C;box-shadow:0 0 0 3px rgba(255,231,163,.4)}
.input.num{font-size:17px;font-weight:800;letter-spacing:.5px}
textarea.input{min-height:88px;resize:vertical;line-height:1.5}
.ledger-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin:4px 0 8px}
.ledger-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1.5px dashed #F2E8D6;font-size:13.5px}
.ledger-row:last-child{border-bottom:0}
.ledger-row .d{color:var(--muted);font-size:12.5px;flex:0 0 auto;width:62px}
.ledger-row .amt{font-weight:800;color:#3E9E72;margin-left:auto;white-space:nowrap}
.ledger-row .amt.out{color:#C9656B}
.today-badge{background:#E4F6E9;color:#3E9E72;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px}
.log-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px dashed #F2E8D6;font-size:13px}
.log-row:last-child{border-bottom:0}
.log-row .log-d{color:#6E5B49;font-weight:700}
.log-row .log-t{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.log-row .amt{font-weight:800;color:#B98B20;white-space:nowrap}
.money-btns{display:flex;gap:8px;margin-top:12px}

/* ---------- meals ---------- */
.meal-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.meal-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
.meal-icon.b{background:#FFF4DE}.meal-icon.l{background:#EFF8F2}.meal-icon.d{background:#F0F5FC}
.meal-body{flex:1;min-width:0}
.meal-name{font-size:14px;font-weight:800;color:#7C6650}
.meal-text{font-size:14px;margin-top:2px;word-break:break-word;color:#4B3B2E}
.meal-text.blank{color:var(--muted2)}
.meal-input{margin-top:6px;border:none;border-bottom:1.5px dashed #E8DCC6;background:transparent;padding:4px 0;width:100%;font-size:14px;outline:none}
.week-meals{display:flex;flex-direction:column;gap:2px}
.wm-row{display:flex;gap:8px;padding:7px 0;border-bottom:1.5px dashed #F2E8D6;font-size:13px;align-items:baseline}
.wm-row:last-child{border-bottom:0}
.wm-row .wm-d{flex:0 0 auto;width:66px;color:var(--muted);font-size:12.5px;font-weight:700}
.wm-row .wm-t{flex:1;color:#5E4B3B;word-break:break-word}

/* ---------- schedule ---------- */
.event{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm)}
.ev-date{flex:0 0 auto;width:46px;text-align:center;border-radius:12px;background:#FFF6DE;border:1px solid #F3E1B4;padding:5px 0}
.ev-date .m{font-size:10px;font-weight:800;color:#B98B20}
.ev-date .dd{font-size:17px;font-weight:800;color:#8A6414;line-height:1.1}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:14.5px;font-weight:800;word-break:break-word}
.ev-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev-dday{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:#EAF5FD;color:#4C90C9}
.ev-dday.today{background:#FFE6EE;color:#E4739A}
.ev-note{font-size:12px;color:#8E7A61;margin-top:4px;line-height:1.45;word-break:break-word}

/* ---------- health ---------- */
.health-card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.hh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hh .av{width:42px;height:42px;border-radius:14px;border:1.5px solid #F2E8D8}
.hh-name{font-size:16px;font-weight:800}
.hh-sub{font-size:11.5px;color:var(--muted);font-weight:700}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tg{
  display:inline-flex;align-items:center;gap:6px;border-radius:13px;padding:9px 12px;font-size:13px;font-weight:800;
  background:#FFFDF6;border:1.6px solid #EFE3CE;color:#9A866D;
}
.tg.on{background:#EAF8EF;border-color:#B9E4C9;color:#3E9E72}
.tg .dot{width:15px;height:15px;border-radius:5px;border:2px solid #D9CDB8;display:flex;align-items:center;justify-content:center}
.tg.on .dot{background:#4CAF7D;border-color:#4CAF7D}
.tg .dot svg{width:10px;height:10px;opacity:0}
.tg.on .dot svg{opacity:1}
.sleep-row{display:flex;align-items:center;gap:8px;background:#F7FBFF;border:1.5px solid #E1EEF9;border-radius:14px;padding:8px 12px}
.sleep-row .sl{font-size:13px;font-weight:800;color:#4C90C9}
.stepper{display:flex;align-items:center;gap:10px;margin-left:auto}
.stepper button{width:30px;height:30px;border-radius:10px;background:#fff;border:1.5px solid #D9E8F4;font-weight:800;color:#4C90C9;font-size:15px;display:flex;align-items:center;justify-content:center}
.stepper .val{font-weight:800;font-size:15px;min-width:52px;text-align:center;color:#2F6E9E}
.mood-row{display:flex;gap:6px;margin-top:9px}
.mood{flex:1;border-radius:12px;border:1.6px solid #EFE3CE;background:#FFFDF6;padding:7px 0;font-size:18px;text-align:center;opacity:.55}
.mood.on{background:#FFF3DC;border-color:#F0CE86;opacity:1}

/* ---------- praise ---------- */
.praise-compose{background:linear-gradient(160deg,#FFF7FB,#FFFBF0);border:1.5px solid #F6E3E0;border-radius:24px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}
.who-row{display:flex;gap:6px;margin-bottom:10px}
.who-row button{flex:1;border-radius:14px;border:1.6px solid #EFE3CE;background:#fff;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:#9A866D}
.who-row button .av{width:26px;height:26px;border-radius:9px}
.who-row button.on{background:#FFF3DC;border-color:#EFCB80;color:#8A6414}
.sticker-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.sticker-row button{flex:0 0 auto;width:40px;height:40px;border-radius:13px;background:#fff;border:1.5px solid #F1E6D4;font-size:20px;display:flex;align-items:center;justify-content:center}
.sticker-row button.on{background:#FFF3D3;border-color:#EFCB80;transform:scale(1.04)}
.praise-card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);display:flex;gap:11px;align-items:flex-start}
.pr-sticker{font-size:26px;line-height:1;flex:0 0 auto;margin-top:2px}
.pr-body{flex:1;min-width:0}
.pr-to{font-size:12px;font-weight:800;color:var(--pink-ink)}
.pr-msg{font-size:14px;margin-top:2px;word-break:break-word;line-height:1.45}
.pr-date{font-size:11px;color:var(--muted2);margin-top:4px}

/* ---------- memo / chat ---------- */
.chat-wrap{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.bubble-row{display:flex;gap:8px;align-items:flex-end}
.bubble-row .av{width:30px;height:30px;border-radius:10px;border:1.5px solid #F1E7D7;margin-bottom:2px}
.bubble-col{max-width:78%}
.bubble-who{font-size:11px;color:var(--muted);font-weight:700;margin:0 0 3px 3px}
.bubble{
  border-radius:18px;border-top-left-radius:6px;padding:10px 13px;font-size:14px;line-height:1.45;
  background:#fff;border:1.5px solid #F1E6D2;box-shadow:0 3px 10px rgba(200,170,125,.09);
  word-break:break-word;white-space:pre-wrap;
}
.bubble.tone-pink{background:#FFF1F6;border-color:#F8DCE7}
.bubble.tone-mint{background:#F1FAF5;border-color:#D9EEE2}
.bubble.tone-blue{background:#F2F8FE;border-color:#DCEBF8}
.bubble.tone-peach{background:#FFF6EE;border-color:#F6E5D4}
.bubble.sticker{font-size:36px;padding:6px 12px;background:transparent;border:0;box-shadow:none}
.bubble-meta{display:flex;gap:6px;align-items:center;margin-top:4px;padding-left:3px}
.bub-btn{font-size:12px;border-radius:9px;border:1.5px solid #F1E6D2;background:#fff;padding:2px 7px;color:#B49E86}
.bub-btn.on{background:#FFEAF0;border-color:#F7C9D8;color:#E4739A}
.chat-bar{position:relative;margin-top:12px;background:rgba(255,253,245,.94);padding:8px 0 4px;border-radius:18px}
.chat-input-row{display:flex;gap:7px;align-items:flex-end}
.chat-input-row .input{flex:1;border-radius:18px;padding:12px 14px}
.send-btn{width:46px;height:46px;border-radius:16px;background:linear-gradient(180deg,#FFE1EC,#FFC9DC);border:1.5px solid #F7BDD2;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.send-btn svg{width:19px;height:19px}
.quick-stickers{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.quick-stickers button{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:#fff;border:1.5px solid #F1E6D4;font-size:19px}
.chat-note{font-size:11px;color:var(--muted2);text-align:center;padding:6px 0 0;line-height:1.5}

/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(8,1fr);
  gap:1px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,253,245,.96);
  border-top:1.5px solid #F3E9D6;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 -6px 20px rgba(200,170,125,.10);
  max-width:480px;margin:0 auto;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:14px;color:#A8967F;transition:all .15s ease}
.tab svg{width:21px;height:21px}
.tab span{font-size:9.5px;font-weight:800;letter-spacing:-.3px}
.tab.on{background:linear-gradient(180deg,#FFF0BF,#FFE79B);color:#8A6414;box-shadow:0 3px 10px rgba(230,190,90,.28)}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(74,58,42,.34);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fade .18s ease;
}
.overlay.center{align-items:center;padding:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:480px;background:#FFFDF7;border-radius:26px 26px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(80,60,40,.2);
  animation:up .22s cubic-bezier(.2,.8,.3,1);max-height:92vh;overflow:auto;
}
.overlay.center .sheet{border-radius:24px;padding-bottom:20px;max-width:400px}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.sheet .hint{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.sheet .field{margin-bottom:12px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1;padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{width:36px;height:36px;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#A6835C}
.cal-month{font-size:16px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;border-radius:12px}
.cal-cell .n{font-size:10.5px;color:#B2A38E;position:absolute;top:2px;left:5px;font-weight:700}
.cal-cell.stamped .n{color:#B0842B;background:rgba(255,253,247,.85);border-radius:6px;padding:0 3px;top:1px;left:2px;font-size:9.5px}
.cal-cell.stamped{background:#FFF7E2}
.cal-cell.stamped svg{width:72%;height:72%;margin-top:6px}
.cal-cell.today{outline:2.5px solid #9FD3F2;outline-offset:-2px}
.cal-cell.future .n{color:#DCD1BF}
.cal-legend{display:flex;gap:10px;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:12px}
.cal-legend .dot{width:12px;height:12px;border-radius:50%;background:#FFF3D3;border:1.5px solid #F0D071;display:inline-block;margin-right:4px;vertical-align:-2px}

/* ---------- toast & confetti ---------- */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);z-index:200;pointer-events:none;opacity:0;transition:all .22s ease;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .t{
  background:rgba(74,58,42,.92);color:#FFF8E8;padding:11px 16px;border-radius:16px;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 24px rgba(60,40,20,.25);text-align:center;line-height:1.4;
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:190;overflow:hidden}
.confetti i{position:absolute;font-size:20px;animation:fall 1.5s ease-in forwards}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(60vh) rotate(220deg);opacity:0}
}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.seg-note{font-size:11.5px;color:var(--muted2);line-height:1.6;text-align:center;margin:4px 0 10px}
.reward-box{margin-top:4px;padding:12px;border:1.5px dashed #EADCC4;border-radius:16px;background:#FFFCF4}
.reward-presets{display:flex;gap:6px;margin-bottom:8px}
.reward-presets button{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid #EFE6D6;background:#fff;font-weight:800;font-size:13px;color:#8E7A61;box-shadow:var(--shadow-sm)}
.reward-presets button.on{background:#FFF6DA;border-color:#F2CF7C;color:#8A6414;box-shadow:0 3px 10px rgba(230,190,90,.22)}
.reward-row{display:flex;align-items:center;gap:8px}
.reward-row .input{flex:1}
.reward-row .unit{font-size:14px;font-weight:800;color:#8E7A61}
.warn{background:#FFF1E8;border:1.5px solid #F6D3B8;color:#A9642F;border-radius:16px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin:0 2px 12px;font-weight:700}

/* ---------- 공유 (카톡) ---------- */
.share-area{
  width:100%;min-height:210px;max-height:44vh;overflow:auto;resize:vertical;
}
textarea.share-area{
  min-height:210px;font-size:13.5px;line-height:1.62;white-space:pre-wrap;
  background:#FFFCF4;border-color:#EADCC4;
}
.share-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.share-actions .btn{padding:14px 12px}

/* =========================================================
   v4 — 홈 배너·시계·가족 상태·전화·알림·일정 달력·식사·데이터 보호
   ========================================================= */
/* 헤더 알림 배지 */
.icon-btn{position:relative}
.badge{
  position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;background:linear-gradient(180deg,#FF93B4,#F06E90);color:#fff;
  font-size:11px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;
  border:2px solid #FFFDF5;box-shadow:0 2px 6px rgba(240,110,144,.42);
}

/* 인사 배너 */
.hero{
  margin:0 0 14px;border-radius:26px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#FFE7EF 0%,#FFF0F4 52%,#FFF7E9 100%);
  border:1.5px solid #F7DFE6;box-shadow:var(--shadow);
}
.hero::before,.hero::after{
  content:'';position:absolute;top:-4px;width:7px;height:24px;border-radius:4px;
  background:linear-gradient(180deg,#F5CAD9,#F9DFE8);opacity:.85;
}
.hero::before{left:32px}
.hero::after{right:32px}
.hero-friends{display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:18px 12px 2px}
.hero-friend{flex:1 1 0;max-width:94px;display:flex;flex-direction:column;align-items:center}
.hero-friend .av{width:100%;aspect-ratio:1/1;border-radius:50%;border:2.5px solid #fff;box-shadow:0 5px 14px rgba(214,150,175,.20)}
.hero-friend .cushion{width:84%;height:11px;border-radius:999px;margin-top:-7px;opacity:.9;box-shadow:0 2px 5px rgba(190,150,165,.18)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 14px 12px}
.hero-cap{font-size:12.5px;font-weight:800;color:#B57E93;letter-spacing:-.2px}
.hero-toggle{
  border-radius:999px;background:rgba(255,255,255,.94);border:1.5px solid #F0DADF;
  padding:6px 13px;font-size:12px;font-weight:800;color:#A98F96;box-shadow:var(--shadow-sm);
}
.hero.closed{margin-bottom:12px}
.hero-compact{display:flex;align-items:center;gap:8px;padding:9px 12px}
.hero-compact .hc-avs{display:flex;gap:-4px;flex:0 0 auto}
.hero-compact .av{width:26px;height:26px;border-radius:9px;border:1.5px solid #fff;margin-right:-6px}
.hero-compact .hc-tx{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:#B57E93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 실시간 시계 */
.clock-row{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;padding:0 4px;margin:2px 0 14px}
.clock{
  font-family:var(--font-title);font-size:38px;line-height:1;color:#5B4A3C;letter-spacing:-1.4px;
  font-variant-numeric:tabular-nums;
}
.clock-date{font-size:14px;font-weight:800;color:#8C7761}

/* 가족 상태 */
.status-scroll{
  display:flex;gap:9px;overflow-x:auto;padding:3px 2px 9px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.status-scroll::-webkit-scrollbar{display:none}
.status-card{
  flex:0 0 47%;max-width:168px;scroll-snap-align:start;border-radius:20px;background:#fff;
  border:1.5px solid #F4E4D6;padding:10px 11px 10px;box-shadow:var(--shadow-sm);
}
.status-card.st-pink{background:linear-gradient(165deg,#FFF8FB,#FFFDF9);border-color:#F8DEE6}
.status-card.st-mint{background:linear-gradient(165deg,#F7FCFA,#FFFDF9);border-color:#DCEFE3}
.status-card.st-blue{background:linear-gradient(165deg,#F8FBFF,#FFFDF9);border-color:#DEECF8}
.status-card.st-peach{background:linear-gradient(165deg,#FFF9F3,#FFFDF9);border-color:#F7E3D3}
.st-head{display:flex;align-items:center;gap:7px;min-width:0}
.st-head .av{width:30px;height:30px;border-radius:11px;border:1.5px solid #F4EBDC;flex:0 0 auto}
.st-name{font-size:13.5px;font-weight:800;letter-spacing:-.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-time{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-pill{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:#5B4A3C;margin:8px 0 9px;line-height:1.25;min-height:32px;word-break:keep-all}
.st-pill .e{font-size:15px;line-height:1}
.st-btn{width:100%;border-radius:13px;background:rgba(255,255,255,.96);border:1.5px solid #F0E4D2;padding:7px 4px;font-size:12px;font-weight:800;color:#8E7A61}
.st-btn:active{background:#FFF6E3}
.st-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.st-opt{display:flex;align-items:center;gap:6px;border-radius:14px;border:1.6px solid #EFE3CE;background:#FFFDF6;padding:10px 9px;font-size:12.5px;font-weight:800;color:#8A7760;text-align:left}
.st-opt.on{background:#FFF3DC;border-color:#EFCB80;color:#8A6414}

/* 지금 바로 연락 */
.call-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.call-btn{
  display:flex;align-items:center;gap:8px;min-width:0;
  border-radius:17px;border:1.5px solid #F3E4D6;background:linear-gradient(170deg,#FFFCF6,#FFF8F2);
  padding:9px 10px;text-align:left;box-shadow:var(--shadow-sm);
}
.call-btn:active{transform:scale(.97)}
a.call-btn,a.call-big{text-decoration:none;color:inherit}
a.call-btn .cb-name,a.call-btn .cb-num,a.call-big{text-decoration:none}
.cb-ic{width:31px;height:31px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;background:#FFEFF3;color:#D98BA4}
.cb-ic svg{width:16px;height:16px}
.sec-title .em-ic{width:17px;height:17px;flex:0 0 auto;color:#B08A5C;display:inline-block;vertical-align:-2px}
.sec-title .em{display:inline-flex;align-items:center}
.call-big .big-ic{width:19px;height:19px;flex:0 0 auto}
.call-big .big-ic{stroke:#C05C7E}
.call-btn .cb-tx{min-width:0;flex:1}
.cb-name{font-size:12.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5B4A3C}
.cb-num{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.call-big{
  width:100%;margin-top:9px;border-radius:20px;padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(150deg,#FFE6EF,#FFEEDF);border:1.5px solid #F7D3DC;
  font-size:15.5px;font-weight:800;color:#C05C7E;box-shadow:0 5px 16px rgba(230,150,170,.22);text-decoration:none;
}
.call-big:active{transform:scale(.98)}
.call-big .n{font-size:11.5px;font-weight:700;color:#CF8FA5}

/* 알림 */
.n-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-bottom:1.5px dashed #F2E8D6}
.n-item:last-of-type{border-bottom:0}
.n-ic{width:34px;height:34px;border-radius:12px;background:#FFF4DE;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.n-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.n-title{font-size:13.5px;font-weight:800;line-height:1.32;color:#4B3B2E}
.n-sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.n-dot{width:8px;height:8px;border-radius:50%;background:#F487A9;margin-top:7px;flex:0 0 auto}
.n-item.read{opacity:.6}
.n-item.read .n-dot{background:#E6DCCC}
.nrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid #EFE3CE;border-radius:15px;padding:10px 12px;background:#FFFDF6;margin-bottom:7px}
.nrow .box{width:21px;height:21px;border-radius:7px;border:2px solid #D9CDB8;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.nrow .box svg{width:12px;height:12px;opacity:0}
.nrow.on{background:#F3FBF6;border-color:#CFEBD9}
.nrow.on .box{background:#4CAF7D;border-color:#4CAF7D}
.nrow.on .box svg{opacity:1}
.nrow .nlab{font-size:13.5px;font-weight:800;color:#7C6650}
.nrow.on .nlab{color:#3E8F68}
.mem-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.mem-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;background:#fff;border:1.5px solid #EFE3CE;color:#A28C74}
.mem-chip .dot{width:13px;height:13px;border-radius:5px;border:2px solid #D9CDB8;background:#fff;display:inline-block}
.mem-chip.on{background:#EAF8EF;border-color:#B9E4C9;color:#3E9E72}
.mem-chip.on .dot{background:#4CAF7D;border-color:#4CAF7D}

/* 루틴 고정 */
.filter-row{display:flex;gap:7px;margin-bottom:12px}
.filter-row button{flex:1;border-radius:15px;padding:9px 6px;font-size:13px;font-weight:800;background:#fff;border:1.5px solid #EFE3CE;color:#9A866D;box-shadow:var(--shadow-sm)}
.filter-row button.on{background:#FFF4D9;border-color:#F2CF7C;color:#8A6414}
.chip.pin{background:#FFF0F4;color:#D4708F;border-color:#F8D8E3}

/* 일정 달력 */
.pcal{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:12px 12px 14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.pcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}
.pcal-dow{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding:5px 0}
.pcal-dow.sun{color:#D98B9B}
.pcal-cell{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13.5px;font-weight:700;color:#5B4A3C;
}
.pcal-cell.empty{visibility:hidden}
.pcal-cell.sun-n{color:#D98B9B}
.pcal-cell.today{background:linear-gradient(180deg,#9FD3F2,#7CC1E8);color:#fff;box-shadow:0 3px 10px rgba(120,180,220,.35)}
.pcal-cell.sel{background:#FFF1C8;box-shadow:inset 0 0 0 1.8px #F0D071}
.pcal-cell.today.sel{background:linear-gradient(180deg,#9FD3F2,#7CC1E8);box-shadow:0 0 0 2.5px #FFF1C8}
.pcal-cell i.dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#F487A9}
.pcal-cell.imp i.dot{width:7px;height:7px;background:#F0B429;box-shadow:0 0 0 2px rgba(255,236,180,.95)}
.pcal-cell.today i.dot{background:#fff;box-shadow:none}
.ev-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed #F2E8D6}
.ev-row:last-child{border-bottom:0}
.ev-ic{width:34px;height:34px;border-radius:12px;background:#EFF6FD;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.ev-row.imp .ev-ic{background:#FFF4DE}
.ev-main{flex:1;min-width:0}
.ev-line{font-size:14px;font-weight:800;letter-spacing:-.3px;line-height:1.3;word-break:break-word;color:#4B3B2E}
.ev-sub2{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:700}
.ev-btns{display:flex;gap:5px;flex:0 0 auto}
.mini-btn.star.on{background:#FFF0BE;border-color:#EFCB80}

/* 식사 */
.mnav{display:flex;gap:7px;margin-bottom:12px}
.mnav button{flex:1;border-radius:15px;padding:9px 4px;font-size:13px;font-weight:800;background:#fff;border:1.5px solid #E7E1D2;color:#9A866D;box-shadow:var(--shadow-sm)}
.mnav button.on{background:#FFF4D9;border-color:#F2CF7C;color:#8A6414}
.meal-day{background:linear-gradient(160deg,#F5FAFF,#EFF8F4);border:1.5px solid #DCEBF5;border-radius:24px;padding:14px 13px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.meal-day-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.meal-day-t{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed #E3EDEA}
.menu-item:last-of-type{border-bottom:0}
.menu-item .mck{width:26px;height:26px;border-radius:9px;border:2px solid #D9CDB8;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.menu-item .mck svg{width:13px;height:13px;opacity:0}
.menu-item.on .mck{background:#4CAF7D;border-color:#4CAF7D}
.menu-item.on .mck svg{opacity:1}
.menu-item .mtx{flex:1;min-width:0;font-size:14.5px;font-weight:700;word-break:break-word;line-height:1.35}
.menu-item.on .mtx{color:#3E7F5F;text-decoration:none}
.alg{flex:0 0 auto;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#FFF4D9;border:1.2px solid #F1DFAE;color:#A8791D;white-space:nowrap}
.alg.none{background:#FFF1F5;border-color:#F8D8E3;color:#D48AA3}
.m-count{text-align:center;font-size:13px;font-weight:800;color:#4C90C9;margin:12px 0 10px}
.meal-note{width:100%;border:1.5px solid #E3EAF0;border-radius:14px;padding:11px 13px;background:#fff;font-size:13.5px;margin-top:10px}
.alg-tools{display:flex;gap:7px;margin-top:9px}
.alg-tools button{flex:1;border-radius:14px;padding:10px 6px;font-size:12.5px;font-weight:800;background:#fff;border:1.5px solid #DCE9F4;color:#5E8CAF}
.alg-legend{margin-top:10px;background:#F7FBFF;border:1.5px solid #E1EEF9;border-radius:14px;padding:10px 12px;font-size:11.5px;line-height:1.75;color:#4E7C9E}
.meal-edit-row{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.meal-edit-row .input{padding:10px;font-size:13.5px}
.meal-edit-row .me-t{flex:1 1 auto;min-width:0}
.meal-edit-row .me-a{flex:0 0 74px;width:74px;text-align:center}

/* 데이터 보호 */
.protect-box{margin-top:14px;border:1.5px solid #F1E6D2;border-radius:22px;background:#FFFCF4;padding:13px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0}
.prow + .prow{border-top:1.5px dashed #F2E8D6}
.p-l{flex:1;min-width:0}
.p-t{font-size:13.5px;font-weight:800;color:#5B4A3C}
.p-s{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.p-b{flex:0 0 auto;border-radius:13px;border:1.5px solid #EFE3CE;background:#fff;padding:9px 12px;font-size:12.5px;font-weight:800;color:#8E7A61;box-shadow:var(--shadow-sm)}
.pw-btn{width:100%;border-radius:16px;padding:13px;font-size:13.5px;font-weight:800;background:linear-gradient(180deg,#FFF6F9,#FFEFF4);border:1.5px solid #F6D8E1;color:#C05C7E;margin-top:2px}
.pw-btn.on{background:linear-gradient(180deg,#E9F8F0,#DFF4E8);border-color:#B9E4C9;color:#2E8F63}
.call-log-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1.5px dashed #F2E8D6;font-size:12.5px}
.call-log-row:last-of-type{border-bottom:0}
.call-log-row .cl-w{font-weight:800;color:#5B4A3C}
.call-log-row .cl-n{color:var(--muted)}
.call-log-row .cl-t{color:var(--muted2);font-size:11px;margin-left:auto;white-space:nowrap}

/* 잠금 화면 */
.lockscreen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(120% 60% at 50% -10%,#FFF6D9 0,rgba(255,246,217,0) 60%),linear-gradient(170deg,#FFFDF5,#FFF6EA 55%,#FFEFF4)}
.lock-card{width:100%;max-width:320px;background:rgba(255,255,255,.9);border:1.5px solid #F3E6D8;border-radius:28px;box-shadow:var(--shadow);padding:22px 20px;text-align:center}
.lock-card .lk-av{width:74px;height:74px;margin:0 auto 10px;display:block}
.lock-card h2{font-family:var(--font-title);font-size:21px;font-weight:400;letter-spacing:-.5px;margin-bottom:3px;color:#5B4A3C}
.lock-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:4px 0 16px}
.pin-dots i{width:14px;height:14px;border-radius:50%;background:#F2E8DA;border:1.5px solid #E6D8C6;transition:all .15s ease}
.pin-dots i.on{background:#F487A9;border-color:#F487A9;transform:scale(1.08)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-pad button{padding:13px 0;border-radius:16px;background:#fff;border:1.5px solid #F0E4D3;font-size:19px;font-weight:800;color:#5B4A3C;box-shadow:var(--shadow-sm)}
.pin-pad button:active{background:#FFF4E1}
.pin-pad button.ghost{font-size:12.5px;color:#B3A18C}
.lock-hint{font-size:11.5px;color:#B3A18C;margin-top:12px;line-height:1.5}
.lock-forgot{margin-top:10px;font-size:11.5px;color:#C0AE99;text-decoration:underline}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* 좁은 화면에서도 제목·공유·알림·설정 버튼이 한 줄에 들어오게 */
@media (max-width:430px){
  .brand h1{font-size:20px}
  .brand .mark{width:34px;height:34px}
  .top-actions{gap:6px}
  .icon-btn{width:42px;height:42px}
  .icon-btn svg{width:19px;height:19px}
  .share-btn{height:42px;font-size:12px;padding:0 9px;gap:4px}

}
@media (max-width:365px){
  .brand .mark{width:30px;height:30px}
  .brand{gap:6px}
  .brand h1{font-size:17.5px}

  .icon-btn svg{width:17px;height:17px}
  .share-btn{height:38px;font-size:11.5px;padding:0 8px;gap:3px}
  .share-btn .s-ic{font-size:13px}
  .top-actions{gap:5px}
  .clock{font-size:31px}
  .status-card{flex:0 0 52%}
}
</style>
</head>

<script>
/* =========================================================
   우리 가족 기록장 · single-device family record app
   all data stays in this browser's localStorage
   ========================================================= */
(function(){
'use strict';

var STORE_KEY = 'familyRecord.v1';
var REWARD_DEFAULT = 100;
/* 용돈 단가 — 설정에서 바꾼 값(S.reward)을 쓰고, 없으면 기본 100원 */
function rewardAmt(){
  var v = S ? +S.reward : 0;
  return (v > 0) ? Math.round(v) : REWARD_DEFAULT;
}

var MEMBERS = [
  { id:'haram', name:'하람', title:'하람공주', sub:'치와와와 함께', avatar:'haram', tone:'pink', kid:true },
  { id:'isol',  name:'이솔', title:'이솔공주', sub:'치와와와 함께', avatar:'isol',  tone:'mint', kid:true },
  { id:'dad',   name:'아빠', title:'아빠',     sub:'하치와레와 함께', avatar:'dad',  tone:'blue', kid:false },
  { id:'mom',   name:'엄마', title:'엄마',     sub:'우사기와 함께',   avatar:'mom',  tone:'peach', kid:false }
];
var KIDS = MEMBERS.filter(function(m){ return m.kid; });

var TABS = [
  { id:'home',     label:'홈',   icon:'home' },
  { id:'routine',  label:'루틴', icon:'routine' },
  { id:'meal',     label:'식사', icon:'meal' },
  { id:'plan',     label:'일정', icon:'plan' },
  { id:'health',   label:'건강', icon:'health' },
  { id:'praise',   label:'칭찬', icon:'praise' },
  { id:'money',    label:'용돈', icon:'money' },
  { id:'memo',     label:'메모', icon:'memo' }
];

var MISSIONS = [
  { emoji:'🍚', title:'저녁밥 같이 차리기' },
  { emoji:'🧹', title:'거실 10분 정리정돈' },
  { emoji:'🚶', title:'다 같이 산책하기' },
  { emoji:'🎲', title:'보드게임 한 판' },
  { emoji:'🍎', title:'과일 깎아 먹기' },
  { emoji:'👕', title:'내일 옷 미리 고르기' },
  { emoji:'🛁', title:'욕실 같이 정리하기' },
  { emoji:'📚', title:'가족 책 읽기 20분' }
];

var STICKERS = ['⭐','💖','🌈','🍀','🌸','🐶','🎉','🍓','☀️'];

/* ---------------- utils ---------------- */
function pad(n){ return (n<10?'0':'')+n; }
function dateKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromKey(k){ var p = String(k).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return dateKey(a) === dateKey(b); }
function weekdayKR(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function won(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
function num(n){ return Math.round(n).toLocaleString('ko-KR'); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function $(sel, root){ return (root||document).querySelector(sel); }
function memberById(id){ for (var i=0;i<MEMBERS.length;i++){ if (MEMBERS[i].id===id) return MEMBERS[i]; } return MEMBERS[0]; }

/* ---------------- storage ---------------- */
var memStore = null;
var storageBlocked = false;
function readRaw(){
  try { return localStorage.getItem(STORE_KEY); } catch(e){ storageBlocked = true; return null; }
}
function writeRaw(v){
  try { localStorage.setItem(STORE_KEY, v); return true; }
  catch(e){ storageBlocked = true; memStore = v; return false; }
}
function probeStorage(){
  try {
    localStorage.setItem('familyRecord.probe', '1');
    localStorage.removeItem('familyRecord.probe');
    return true;
  } catch(e){ storageBlocked = true; return false; }
}

var DEFAULTS = {
  version: 1,
  tab: 'home',
  reward: REWARD_DEFAULT,
  todos: {
    haram: ['정리정돈하기','책 30분 읽기','공부하기'],
    isol:  ['정리정돈하기','내일 준비물 챙기기','공부하기'],
    dad:   ['아이들 책 읽어주기','분리수거하기','정리정돈 돕기'],
    mom:   ['아이들 알림장 확인','정리정돈 체크','저녁 준비하기','아이들 영양제 챙기기']
  },
  routines: {
    haram: [
      { text:'정리정돈하기', note:'', pinned:false },
      { text:'책 30분 읽기', note:'', pinned:false },
      { text:'받아쓰기 연습', note:'10문제', pinned:false },
      { text:'키즈신문', note:'1장', pinned:false },
      { text:'구몬국어', note:'4장', pinned:true },
      { text:'구몬수학', note:'4장', pinned:true },
      { text:'오늘의 학습지', note:'', pinned:false }
    ],
    isol: [
      { text:'정리정돈하기', note:'', pinned:false },
      { text:'책 30분 읽기', note:'', pinned:false },
      { text:'받아쓰기 연습', note:'10문제', pinned:false },
      { text:'키즈신문', note:'1장', pinned:false },
      { text:'구몬국어', note:'4장', pinned:true },
      { text:'구몬수학', note:'4장', pinned:true },
      { text:'오늘의 학습지', note:'', pinned:false }
    ]
  },
  allowance: {
    haram: { start: 0, deposit: [], spend: [] },
    isol:  { start: 0, deposit: [], spend: [] }
  },
  mission: { emoji:'🍚', title:'저녁밥 같이 차리기', count: 0, done: {} },
  meals: {},
  events: [],
  health: {},
  praise: [],
  memos: [],
  /* --- v4 --- */
  status: {},
  phones: { haram:'', isol:'', dad:'', mom:'' },
  calls: [],
  notif: {
    read: {},
    settings: { event30:false, medicine:false, pickup:false, routine:true, message:true, praise:true, dinner:false },
    members: { haram:true, isol:true, dad:true, mom:true }
  },
  security: { pin:'', hint:'', kidLock:false },
  planCal: { offset:0, sel:'' },
  mealDate: '',
  bannerClosed: false,
  savedAt: 0,
  ui: { routineKid:'haram', moneyKid:'haram', praiseTo:'haram', praiseSticker:'⭐', memoWho:'haram', routineFilter:'all', algOpen:false }
};

var S = null;

function freshState(){
  var s = JSON.parse(JSON.stringify(DEFAULTS));
  s.todos = {};
  for (var m in DEFAULTS.todos){
    s.todos[m] = DEFAULTS.todos[m].map(function(t){ return { id: uid(), text: t, done: false }; });
  }
  s.routines = {};
  for (var r in DEFAULTS.routines){
    s.routines[r] = DEFAULTS.routines[r].map(function(it){
      return { id: uid(), text: it.text, note: it.note, pinned: !!it.pinned };
    });
  }
  s.checks = { haram:{}, isol:{} };
  s.mission = { emoji:'🍚', title:'저녁밥 같이 차리기', count:0, done:{} };
  s.allowance = {
    haram:{ start:0, deposit:[], spend:[] },
    isol:{ start:0, deposit:[], spend:[] }
  };
  return s;
}

function load(){
  var raw = readRaw();
  if (!raw){ S = freshState(); save(); return; }
  try {
    var parsed = JSON.parse(raw);
    S = mergeDefaults(parsed);
  } catch(e){
    S = freshState();
  }
}
function mergeDefaults(p){
  var s = freshState();
  if (!p || typeof p !== 'object') return s;
  ['todos','routines','checks','allowance','mission','meals','events','health','praise','memos','ui',
   'status','phones','calls','notif','security','planCal'].forEach(function(k){
    if (p[k] && typeof p[k] === 'object') s[k] = p[k];
  });
  if (p.tab) s.tab = p.tab;
  if (p.reward != null && +p.reward > 0) s.reward = Math.round(+p.reward);
  if (!(s.reward > 0)) s.reward = REWARD_DEFAULT;
  if (typeof p.bannerClosed === 'boolean') s.bannerClosed = p.bannerClosed;
  if (+p.savedAt > 0) s.savedAt = +p.savedAt;
  // guarantee all four members exist in todos
  MEMBERS.forEach(function(m){
    if (!Array.isArray(s.todos[m.id])) s.todos[m.id] = [];
  });
  KIDS.forEach(function(m){
    if (!Array.isArray(s.routines[m.id])) s.routines[m.id] = [];
    if (!s.checks[m.id]) s.checks[m.id] = {};
    if (!s.allowance[m.id]) s.allowance[m.id] = { start:0, deposit:[], spend:[] };
    if (!Array.isArray(s.allowance[m.id].deposit)) s.allowance[m.id].deposit = [];

  if (!s.security || typeof s.security !== 'object') s.security = { pin:'', hint:'', kidLock:false };

  if (typeof s.planCal.sel !== 'string') s.planCal.sel = '';

  if (s.meals && typeof s.meals === 'object'){

/* 예전 meals[날짜] = {breakfast,lunch,dinner} → {items:[], memo} */
function normalizeMealDay(day){
  if (!day || typeof day !== 'object') return { items: [], memo: '' };
  if (Array.isArray(day.items)){
    return { items: day.items.map(function(it){
      return { id: (it && it.id) || uid(), text: (it && it.text) || '', allergy: (it && it.allergy) || '', checked: !!(it && it.checked) };
    }), memo: typeof day.memo === 'string' ? day.memo : '' };
  }
  var items = [], seen = false;
  ['breakfast','lunch','dinner'].forEach(function(k){
    var v = day[k];
    if (v && String(v).trim()){
      seen = true;
      var label = k === 'breakfast' ? '아침' : (k === 'lunch' ? '점심' : '저녁');
      items.push({ id: uid(), text: label + ' · ' + String(v).trim(), allergy:'', checked: true });
    }
  });
  return { items: items, memo: seen ? '' : (typeof day.memo === 'string' ? day.memo : '') };
}

function todayKey(){ return dateKey(new Date()); }
function checksOf(id, key){
  var all = S.checks[id] || {};
  return all[key || todayKey()] || {};
}
function routineItems(id){ return S.routines[id] || []; }
function routineDoneCount(id, key){
  var c = checksOf(id, key), n = 0;
  routineItems(id).forEach(function(it){ if (c[it.id]) n++; });
  return n;
}
function routineEarnedOn(id, key){ return routineDoneCount(id, key) * rewardAmt(); }
function earnedTotal(id){
  var all = S.checks[id] || {}, total = 0;
  for (var k in all){ total += routineDoneCount(id, k) * rewardAmt(); }
  return total;
}
function depositTotal(id){ return (S.allowance[id].deposit||[]).reduce(function(a,x){ return a + (+x.amount||0); }, 0); }
function spendTotal(id){ return (S.allowance[id].spend||[]).reduce(function(a,x){ return a + (+x.amount||0); }, 0); }
function balance(id){ return (+S.allowance[id].start||0) + earnedTotal(id) + depositTotal(id) - spendTotal(id); }
function isStamped(id, d){
  return routineDoneCount(id, dateKey(d)) > 0;
}
function streakOf(id){
  var d = new Date();
  if (!isStamped(id, d)) d = addDays(d, -1);
  var n = 0;
  while (isStamped(id, d)){ n++; d = addDays(d, -1); if (n > 4000) break; }
  return n;
}
function monthStampCount(id, d){
  d = d || new Date();
  var y = d.getFullYear(), m = d.getMonth(), n = 0;
  var last = new Date(y, m+1, 0).getDate();
  for (var i=1;i<=last;i++){ if (isStamped(id, new Date(y, m, i))) n++; }
  return n;
}
function weekDays(base){
  var d = base ? new Date(base.getTime()) : new Date();
  var dow = d.getDay(); // 0 sun
  var offset = (dow === 0 ? -6 : 1 - dow);
  var monday = addDays(d, offset);
  var out = [];
  for (var i=0;i<7;i++) out.push(addDays(monday, i));
  return out;
}
function todoCount(id){
  var list = S.todos[id] || [];
  var done = list.filter(function(t){ return t.done; }).length;
  return { done: done, total: list.length };
}
function praiseCount(id){
  return (S.praise||[]).filter(function(p){ return p.to === id; }).length;
}
function allTodosProgress(){
  var done = 0, total = 0;
  MEMBERS.forEach(function(m){ var c = todoCount(m.id); done += c.done; total += c.total; });
  return { done: done, total: total };
}
function stampCountToday(){

}

  h += '<section class="card mint" style="padding:14px 12px">';

    '<div class="sec-head"><div class="sec-title"><span class="em">✅</span>오늘 할 일</div>' +

    '<p class="sec-sub">하람·이솔·아빠·엄마가 각자 할 일을 체크해요</p>';

  h += '</section>';
  return h;
}

function stampBoard(k){
  var days = weekDays(new Date());
  var todayKeyStr = todayKey();
  var stampedToday = isStamped(k.id, new Date());
  var weekHtml = '<div class="week">';
  days.forEach(function(d, i){
    var key = dateKey(d);
    var filled = isStamped(k.id, d);
    var isToday = key === todayKeyStr;
    var future = d > new Date() && !isToday;
    weekHtml += '<div class="day"><div class="dow' + (i === 6 ? ' sun' : '') + '">' + weekdayKR(d) + '</div>' +
      '<div class="slot' + (filled ? ' filled' : '') + (isToday ? ' today' : '') + (future ? ' future' : '') + '">' +
      (filled ? stampSVG(k.avatar) : '') + '</div></div>';
  });
  weekHtml += '</div>';
  var monthCount = monthStampCount(k.id);
  return '<section class="card stamp-card pink">' +
    '<div class="sec-head"><div class="sec-title"><span class="em">🐶</span>' + k.title + ' 도장판</div>' +
      '<span class="pill soft-yellow">🔥 ' + streakOf(k.id) + '일 연속</span></div>' +
    '<p class="sec-sub">' + k.title + '가 그날 공부, 책읽기나 하루 루틴을 하나라도 마치면 치와와 도장이 찍혀요</p>' +
    weekHtml +
    '<div class="stamp-foot">' +
      '<span class="pill soft-pink">이번 달 도장 ' + monthCount + '개 · ' + (stampedToday ? '오늘 찍음' : '오늘 아직') + '</span>' +
      '<button class="btn" data-act="stampCal" data-kid="' + k.id + '">📅 도장판 달력 보기</button>' +
    '</div></section>';
}

/* ---------------- 루틴 ---------------- */
function renderRoutine(){
  var kid = S.ui.routineKid;
  var m = memberById(kid);
  var items = routineItems(kid);
  var done = routineDoneCount(kid);
  var total = items.length;
  var pct = total ? Math.round(done / total * 100) : 0;
  var filter = S.ui.routineFilter || 'all';
  var pinnedCount = items.filter(function(it){ return it.pinned; }).length;

  var sorted = items.map(function(it, i){ return { it: it, i: i }; })
    .sort(function(a, b){ return (b.it.pinned ? 1 : 0) - (a.it.pinned ? 1 : 0) || a.i - b.i; })
    .map(function(x){ return x.it; });
  if (filter === 'pinned') sorted = sorted.filter(function(it){ return it.pinned; });

  var h = switchPills('routineKid', kid);
  h += '<section class="card">' +
    '<div class="routine-head"><span class="av">' + avatarSVG(m.avatar) + '</span>' +
      '<div style="flex:1;min-width:0"><div class="rh-name">' + m.title + ' 루틴</div>' +
        '<div class="rh-prog">' + done + '/' + total + '개 완료 · 📌 고정 ' + pinnedCount + '개</div></div>' +
      '<span class="pill soft-yellow">🐷 ' + won(routineEarnedOn(kid)) + '</span></div>' +
    '<div class="bar pink"><i style="width:' + pct + '%"></i></div>' +
    '<div class="filter-row">' +
      '<button class="' + (filter === 'all' ? 'on' : '') + '" data-act="routineFilter" data-v="all">전체 ' + total + '개</button>' +
      '<button class="' + (filter === 'pinned' ? 'on' : '') + '" data-act="routineFilter" data-v="pinned">📌 고정 루틴 ' + pinnedCount + '개</button>' +
    '</div>' +
    '<ul class="routine-list">';

  if (!sorted.length){
    h += '<li class="empty">' + (filter === 'pinned'
      ? '고정 루틴이 없어요<br>루틴 오른쪽 📌를 누르면 매일 챙기는 루틴으로 표시돼요'
      : '아직 루틴이 없어요<br>아래 버튼으로 오늘의 루틴을 추가해요') + '</li>';
  }
  sorted.forEach(function(it){
    var on = !!checksOf(kid)[it.id];
    h += '<li class="ritem' + (on ? ' done' : '') + '">' +
      '<button class="chk blue' + (on ? ' on' : '') + '" data-act="routineToggle" data-kid="' + kid + '" data-id="' + it.id + '" aria-label="완료 체크">' + checkMark() + '</button>' +
      '<div class="rtext" data-act="routineToggle" data-kid="' + kid + '" data-id="' + it.id + '">' + esc(it.text) +
        '<div class="meta">' + (it.pinned ? '<span class="chip pin">📌 고정</span>' : '') +
        (it.note ? '<span class="chip">' + esc(it.note) + '</span>' : '') +
        '<span class="chip money">🪙 ' + won(rewardAmt()) + '</span></div></div>' +
      '<div class="btns">' +
        '<button class="mini-btn pin' + (it.pinned ? ' on' : '') + '" data-act="routinePin" data-kid="' + kid + '" data-id="' + it.id + '" aria-label="고정" aria-pressed="' + (it.pinned ? 'true' : 'false') + '">📌</button>' +
        '<button class="mini-btn" data-act="routineEdit" data-kid="' + kid + '" data-id="' + it.id + '" aria-label="수정">✏️</button>' +
        '<button class="mini-btn del" data-act="routineDel" data-kid="' + kid + '" data-id="' + it.id + '" aria-label="삭제">✕</button>' +
      '</div></li>';
  });
  h += '</ul><button class="todo-add" data-act="routineAdd">+ 루틴 추가</button>' +
    '<p class="routine-note">루틴을 하나라도 마치면 ' + m.title + ' 도장판에 도장이 찍히고,<br>' + won(rewardAmt()) + '씩 용돈기입장에 쌓여요.</p>' +
    '</section>';

  h += '<section class="card mint" style="padding:14px">' +
    '<div class="sec-title" style="font-size:15px"><span class="em">🐷</span>' + m.title + ' 돼지저금통</div>' +
    '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">' +
      '<div style="font-family:var(--font-title);font-size:30px;color:#8A6414">' + won(balance(kid)) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);font-weight:700">지금까지 모은 돈</div></div>' +
    '<button class="btn block" style="margin-top:10px" data-act="goMoney" data-kid="' + kid + '">용돈기입장 보기 →</button>' +
    '</section>';
  return h;
}

/* ---------------- 용돈 ---------------- */
function renderMoney(){
  var kid = S.ui.moneyKid;
  var m = memberById(kid);
  var earned = earnedTotal(kid);
  var dep = depositTotal(kid);
  var spd = spendTotal(kid);

  var h = switchPills('moneyKid', kid);
  h += '<div style="text-align:center;margin:2px 0 12px">' +
    '<div style="font-size:20px;font-weight:800;letter-spacing:-.5px">' + m.title + ' 용돈기입장</div>' +
    '<div style="font-size:11.5px;color:var(--muted);margin-top:2px">공부·루틴을 마칠 때마다 ' + won(rewardAmt()) + '씩 쌓여요 · 이 기기에만 저장돼요</div></div>';

  h += '<section class="balance-card">' +
    '<div class="bal-top"><div class="bal-label">지금 모은 돈</div>' +
      '<div class="bal-num">' + num(balance(kid)) + '<small>원</small></div></div>' +
    '<div class="chips">' +
      '<span class="pill">시작 금액 <b>' + num(+S.allowance[kid].start || 0) + '원</b></span>' +
      '<span class="pill soft-yellow">공부 적립 <b>+' + num(earned) + '원</b></span>' +
      '<span class="pill soft-blue">입금 <b>+' + num(dep) + '원</b></span>' +
      '<span class="pill minus">사용 <b>-' + num(spd) + '원</b></span>' +
    '</div>' +
    '<hr class="hr">' +
    '<div class="field-label">시작 금액 (이미 모아 둔 돈)</div>' +
    '<input class="input num" type="number" inputmode="numeric" min="0" step="100" value="' + (+S.allowance[kid].start || 0) + '" data-act="startMoney" data-kid="' + kid + '">' +
    '<div class="money-btns">' +
      '<button class="btn grow" data-act="moneyAdd" data-kid="' + kid + '" data-type="deposit">＋ 입금</button>' +
      '<button class="btn grow" data-act="moneyAdd" data-kid="' + kid + '" data-type="spend">－ 사용</button>' +
    '</div>' +
    '</section>';

  // 매일 공부·루틴 적립
  var days = Object.keys(S.checks[kid] || {}).filter(function(k){ return routineDoneCount(kid, k) > 0; })
    .sort().reverse().slice(0, 14);
  h += '<section class="card" style="margin-top:14px">' +
    '<div class="ledger-title">📅 매일 공부·루틴 적립</div>' +
    '<p class="sec-sub" style="margin-bottom:8px">하루에 한 줄로 그날 총액만 보여요</p>';
  if (!days.length){
    h += '<div class="empty">아직 적립한 날이 없어요<br>루틴을 하나 완료하면 여기에 쌓여요</div>';
  } else {
    days.forEach(function(k){
      var n = routineDoneCount(kid, k);
      var d = fromKey(k);
      h += '<div class="log-row"><span class="log-d">' + (d.getMonth()+1) + '월 ' + d.getDate() + '일' +
        (k === todayKey() ? '<span class="today-badge">오늘</span>' : '') + '</span>' +
        '<span class="log-t">완료 ' + n + '개</span>' +
        '<span class="amt">+' + num(n * rewardAmt()) + '원</span></div>';
    });
  }
  h += '</section>';

  // 입금 / 사용 내역
  var moves = [];
  (S.allowance[kid].deposit || []).forEach(function(x){ moves.push({ type:'deposit', x: x }); });
  (S.allowance[kid].spend || []).forEach(function(x){ moves.push({ type:'spend', x: x }); });
  moves.sort(function(a, b){ return (b.x.ts || 0) - (a.x.ts || 0); });
  h += '<section class="card" style="margin-top:14px">' +
    '<div class="ledger-title">🧾 입금 · 사용 내역</div>';
  if (!moves.length){
    h += '<div class="empty">입금이나 사용을 기록하면 여기에 남아요</div>';
  } else {
    moves.slice(0, 30).forEach(function(mv){
      var x = mv.x;
      h += '<div class="ledger-row">' +
        '<span class="d">' + (x.date || '') + '</span>' +
        '<span style="flex:1;min-width:0;word-break:break-word">' + (x.memo ? esc(x.memo) : (mv.type === 'deposit' ? '입금' : '사용')) + '</span>' +

/* ---------------- 일정 ---------------- */
/* 날짜 범위(startDate ~ endDate)에 걸린 일정만 골라 내기 */
function eventEnd(e){ return (e.endDate && e.endDate >= e.date) ? e.endDate : e.date; }
function eventsOn(k){
  return (S.events || []).filter(function(e){
    return e.date && e.date <= k && k <= eventEnd(e);
  });
}
function upcomingEvents(n){
  var key = todayKey();
  return (S.events || []).filter(function(e){ return eventEnd(e) >= key && e.date; })
    .sort(function(a, b){
      return (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1;
    }).slice(0, n || 20);
}
function renderPlan(){
  var cal = S.planCal || (S.planCal = { offset:0, sel:'' });
  var base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + (cal.offset || 0));
  var y = base.getFullYear(), mo = base.getMonth();
  var first = new Date(y, mo, 1);
  var startPad = first.getDay();               /* 일요일부터 시작 */
  var last = new Date(y, mo + 1, 0).getDate();
  var key = todayKey();

  var cells = '';
  ['일','월','화','수','목','금','토'].forEach(function(dw, i){
    cells += '<div class="pcal-dow' + (i === 0 ? ' sun' : '') + '">' + dw + '</div>';
  });
  for (var p = 0; p < startPad; p++) cells += '<div class="pcal-cell empty"></div>';
  for (var day = 1; day <= last; day++){
    var k = y + '-' + pad(mo + 1) + '-' + pad(day);
    var dayEvents = eventsOn(k);
    var imp = dayEvents.some(function(e){ return e.important; });
    var dow = new Date(y, mo, day).getDay();
    cells += '<button class="pcal-cell' + (k === key ? ' today' : '') + (k === cal.sel ? ' sel' : '') +
      (imp ? ' imp' : '') + (dow === 0 && k !== key ? ' sun-n' : '') + '" data-act="planPick" data-d="' + k + '">' +
      day + (dayEvents.length ? '<i class="dot"></i>' : '') + '</button>';
  }

  var h = '<section class="card" style="padding:14px">' +
    '<div class="sec-head"><div class="sec-title"><span class="em">🗓</span>가족 일정</div>' +
      '<button class="btn" data-act="eventAdd" style="padding:9px 13px;font-size:13px;border-radius:14px">+ 일정 추가</button></div>' +
    '<p class="sec-sub">생일, 병원, 여행, 학교 일정을 기록해요</p>' +
    '<div class="pcal">' +
      '<div class="cal-head"><button data-act="planPrev" aria-label="이전 달">' + icon('chevL') + '</button>' +
        '<div class="cal-month">' + y + '년 ' + (mo + 1) + '월</div>' +
        '<button data-act="planNext" aria-label="다음 달">' + icon('chevR') + '</button></div>' +
      '<div class="pcal-grid">' + cells + '</div>' +
    '</div>';

  var sel = cal.sel;
  var list = sel ? eventsOn(sel) : upcomingEvents(6);
  var listTitle = sel
    ? (fromKey(sel).getMonth() + 1) + '월 ' + fromKey(sel).getDate() + '일 일정' + (list.length ? ' ' + list.length + '개' : '')
    : '다가오는 일정';
  if (!sel && !list.length) listTitle = '등록된 일정';
  h += '<div class="sec-head" style="margin-top:6px"><div class="sec-title" style="font-size:15px"><span class="em">📌</span>' + listTitle + '</div>' +
    (sel ? '<button class="mini-btn" style="width:auto;padding:0 9px;font-size:11.5px" data-act="planPick" data-d="" aria-label="전체 보기">전체</button>' : '') + '</div>';
  if (!list.length){
    h += '<div class="empty">' + (sel ? '이날은 일정이 없어요' : '아직 등록된 일정이 없어요<br>+ 일정 추가로 첫 일정을 적어 보세요') + '</div>';
  }
  list.forEach(function(e){ h += planRow(e); });
  h += '</section>';

  return h;
}

var calKid = 'haram', calOffset = 0;
function openCalendar(kid){
  calKid = kid || 'haram';
  calOffset = 0;
  drawCalendar();
}
function drawCalendar(){
  var base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calOffset);
  var y = base.getFullYear(), m = base.getMonth();
  var first = new Date(y, m, 1);
  var startPad = (first.getDay() === 0 ? 6 : first.getDay() - 1);
  var last = new Date(y, m + 1, 0).getDate();
  var kid = memberById(calKid);
  var count = 0;

  var cells = '';
  var dows = ['월','화','수','목','금','토','일'];
  dows.forEach(function(dw, i){ cells += '<div class="cal-dow"' + (i === 6 ? ' style="color:#D98B9B"' : '') + '>' + dw + '</div>'; });
  for (var i = 0; i < startPad; i++) cells += '<div class="cal-cell"></div>';
  for (var day = 1; day <= last; day++){
    var d = new Date(y, m, day);
    var stamped = isStamped(calKid, d);
    if (stamped) count++;
    var isToday = dateKey(d) === todayKey();
    var future = d > new Date();
    cells += '<div class="cal-cell' + (stamped ? ' stamped' : '') + (isToday ? ' today' : '') + (future ? ' future' : '') + '">' +
      '<span class="n">' + day + '</span>' + (stamped ? stampSVG(kid.avatar) : '') + '</div>';
  }

  var html = '<div class="cal-head"><button data-act="calPrev">' + icon('chevL') + '</button>' +
    '<div class="cal-month">' + y + '년 ' + (m + 1) + '월 · 도장 ' + count + '개</div>' +
    '<button data-act="calNext">' + icon('chevR') + '</button></div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px"><span class="av" style="width:26px;height:26px;border-radius:9px">' + avatarSVG(kid.avatar) + '</span>' +
      '<span style="font-size:13px;font-weight:800">' + kid.title + ' 도장판</span></div>' +
    '<div class="cal-grid">' + cells + '</div>' +
    '<div class="cal-legend"><span><span class="dot"></span>도장 찍은 날</span><span>· 이번 달 ' + count + '개</span></div>' +
    '<div class="actions"><button class="btn block" data-act="closeModal">닫기</button></div>';
  openModal(html);
}

/* ---------------- 카톡 공유 ---------------- */
function trimText(t, max){
  t = String(t == null ? '' : t).replace(/\s+/g, ' ').trim();
  if (!max) return t;
  var chars = Array.from(t);   /* 이모지가 중간에 잘리지 않게 글자 단위로 */
  if (chars.length > max) t = chars.slice(0, max - 1).join('').trim() + '…';
  return t;
}
function ddayLabel(dateStr){
  var diff = Math.round((fromKey(dateStr) - fromKey(todayKey())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff > 0) return 'D-' + diff;
  return '';
}
function recentMemos(n){
  return (S.memos || []).filter(function(m){ return m.sticker || trimText(m.text, 1); })
    .slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); }).slice(0, n);
}

/* 오늘 기록을 카톡에 붙여넣기 좋은 글로 정리 */
function buildShareText(){
  var now = new Date();
  var key = todayKey();
  var L = [];

  L.push('🏡 우리 가족 기록장 (' + now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + weekdayKR(now) + '요일)');
  L.push('');

  /* 가족 미션 */
  var missionDone = !!((S.mission.done || {})[key]);
  L.push('🎲 가족 미션 · ' + (missionDone ? '✅ 오늘 완료' : '⬜ 아직'));
  L.push('· ' + S.mission.emoji + ' ' + trimText(S.mission.title, 40) + (S.mission.count ? ' (함께 ' + S.mission.count + '번째)' : ''));
  L.push('');

  /* 오늘 할 일 — 하람 · 이솔 · 아빠 · 엄마 */
  L.push('✅ 오늘 할 일');
  var wroteTodo = false;
  MEMBERS.forEach(function(m){
    var list = S.todos[m.id] || [];
    if (!list.length) return;
    wroteTodo = true;
    var c = todoCount(m.id);
    var line = '· ' + m.title + ' ' + c.done + '/' + c.total + ' — ';
    line += list.map(function(t){ return (t.done ? '✅' : '⬜') + ' ' + trimText(t.text, 24); }).join('  ');
    if (c.done === c.total) line += '  🎉';
    L.push(line);
  });
  if (!wroteTodo) L.push('· 아직 적어 둔 할 일이 없어요');
  L.push('');

  /* 하람 · 이솔 루틴 · 도장 · 용돈 */
  L.push('⭐ 루틴 · 도장 · 용돈');
  KIDS.forEach(function(k){
    var total = routineItems(k.id).length;
    var done = routineDoneCount(k.id);
    L.push('· ' + k.title + ' 루틴 ' + done + '/' + total +
      ' · 오늘 도장 ' + (isStamped(k.id, now) ? '✅' : '⬜') +
      ' · 잔액 ' + won(balance(k.id)));
  });
  L.push('');

  /* 오늘 · 다가오는 일정 */
  var evs = (S.events || []).filter(function(e){ return e.date && e.date >= key; })
    .sort(function(a, b){ return (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1; })
    .slice(0, 3);
  if (evs.length){
    L.push('🗓 일정');
    evs.forEach(function(e){
      var d = fromKey(e.date);
      var who = e.who ? memberById(e.who).title : '온 가족';
      L.push('· ' + (d.getMonth()+1) + '/' + d.getDate() + ' (' + weekdayKR(d) + ') ' +
        (e.time ? e.time + ' ' : '') + trimText(e.title, 30) +
        ' (' + ddayLabel(e.date) + ' · ' + who + ')');
    });
    L.push('');
  }

  /* 최근 메모 */
  var memos = recentMemos(2);
  if (memos.length){
    L.push('💬 최근 메모');
    memos.forEach(function(msg){
      var who = msg.who ? memberById(msg.who).title : '';
      L.push('· ' + (who ? who + ': ' : '') + (msg.sticker ? msg.sticker : trimText(msg.text, 40)));
    });
    L.push('');
  }

  while (L.length && L[L.length - 1] === '') L.pop();
  return L.join('\n');
}

/* setTimeout 없이 in-app 복사 — 안 되면 옛 방식으로 */
function legacyCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.fontSize = '16px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function copyText(text){
  return new Promise(function(resolve, reject){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ resolve(); }, function(){
        if (legacyCopy(text)) resolve(); else reject(new Error('copy-failed'));
      });
    } else if (legacyCopy(text)){
      resolve();
    } else {
      reject(new Error('copy-failed'));
    }
  });
}
function copyAndToast(text, okMsg){
  copyText(text).then(function(){
    toast(okMsg || '카톡에 붙여넣기 할 수 있게 복사했어요!');
  }, function(){
    toast('복사를 못 했어요. 미리보기 글자를 길게 눌러 복사해 주세요');
  });
}

function relTime(ts){
  if (!ts) return '아직 안 바꿨어요';
  var d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '방금 전 바뀜';
  if (d < 3600) return Math.floor(d / 60) + '분 전 바뀜';
  if (d < 86400) return Math.floor(d / 3600) + '시간 전 바뀜';
  var dd = Math.floor(d / 86400);
  if (dd === 1) return '어제 바뀜';
  if (dd < 7) return dd + '일 전 바뀜';
  var dt = new Date(ts);
  return (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 바뀜';
}

function needAdult(act){ return kidLocked() && !!GUARDED[act]; }
function pinHash(p){
  var s = 'familyRecord|' + String(p) + '|chwawa', hh = 5381;
  for (var i = 0; i < s.length; i++) hh = ((hh << 5) + hh + s.charCodeAt(i)) | 0;
  return (hh >>> 0).toString(36);
}
var pinBuf = '', pinMode = 'unlock', pinPending = null;
function pinPadHTML(){
  var keys = ['1','2','3','4','5','6','7','8','9','clr','0','del'];
  return '<div class="pin-pad">' + keys.map(function(k){
    if (k === 'clr') return '<button class="ghost" data-act="pinKey" data-k="clr">지움</button>';
    if (k === 'del') return '<button class="ghost" data-act="pinKey" data-k="del">⌫</button>';
    return '<button data-act="pinKey" data-k="' + k + '">' + k + '</button>';
  }).join('') + '</div>';
}
function paintDots(){
  var groups = document.querySelectorAll('.pin-dots');
  for (var j = 0; j < groups.length; j++){
    var ch = groups[j].children;
    for (var i = 0; i < ch.length; i++) ch[i].classList.toggle('on', i < pinBuf.length);
  }
}
function showLockScreen(){
  if (document.getElementById('lockScreen')) return;
  pinMode = 'unlock'; pinBuf = '';
  var wrap = document.createElement('div');
  wrap.className = 'lockscreen';
  wrap.id = 'lockScreen';
  wrap.innerHTML = '<div class="lock-card" id="lockCard">' +
    '<span class="lk-av">' + avatarSVG('haram') + '</span>' +
    '<h2>우리 가족 기록장</h2>' +
    '<p class="lock-sub">비밀번호 4자리를 눌러 주세요</p>' +
    '<div class="pin-dots"><i></i><i></i><i></i><i></i></div>' +
    pinPadHTML() +
    (S.security.hint ? '<p class="lock-hint">힌트 · ' + esc(S.security.hint) + '</p>' : '') +
    '<button class="lock-forgot" data-act="pinForgot">비밀번호를 잊었어요</button>' +
  '</div>';
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
}
function hideLockScreen(){
  var w = document.getElementById('lockScreen');
  if (w) w.remove();
  document.body.style.overflow = '';
}
function pinKey(k){
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (k === 'clr') pinBuf = '';
  else if (pinBuf.length < 4) pinBuf += k;
  paintDots();
  if (pinBuf.length === 4) setTimeout(checkPin, 130);
}
function checkPin(){
  var ok = pinHash(pinBuf) === ((S.security && S.security.pin) || '');
  if (!ok){
    pinBuf = ''; paintDots();
    var card = document.querySelector('#lockCard') || document.querySelector('.overlay .sheet');
    if (card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
    buzz(30); toast('비밀번호가 맞지 않아요');
    return;
  }
  pinBuf = ''; paintDots();
  if (pinMode === 'adult'){
    adultPassUntil = Date.now() + 5 * 60 * 1000;
    var pend = pinPending; pinPending = null;
    closeModal();
    toast('어른 확인 완료 · 5분 동안 바꿀 수 있어요');
    if (pend) onAction(pend.act, { dataset: pend.ds, classList: { contains: function(){ return false; } }, parentNode: null });
  } else {
    hideLockScreen();
    render();
    buzz(10);
    toast('다시 오셨네요! 오늘도 화이팅 🐶');
  }
}
function openAdultCheck(){
  var hasPin = !!(S.security && S.security.pin);
  pinMode = 'adult'; pinBuf = '';
  var html;
  if (hasPin){
    html = '<h3>🔒 비밀번호 확인</h3>' +
      '<p class="hint">이 기기는 하람·이솔 기기로 잠겨 있어요.<br>어른 비밀번호 4자리를 눌러 주세요.</p>' +
      '<div class="pin-dots"><i></i><i></i><i></i><i></i></div>' + pinPadHTML() +
      '<div class="actions"><button class="btn block" data-act="closeModal">취소</button></div>';
  } else {
    html = '<h3>🔒 어른 확인</h3>' +
      '<p class="hint">이 기기는 하람·이솔 기기로 잠겨 있어요.<br>어른이면 확인을 눌러 주세요.</p>' +
      '<div class="actions"><button class="btn" data-act="closeModal">취소</button>' +
      '<button class="btn main" data-act="adultYes">어른이에요</button></div>';
  }
  openModal(html, { focus:false });
}

      '<div class="field"><div class="field-label">힌트 (선택)</div><input class="input" id="pinHint" value="' + esc(sec.hint || '') + '" placeholder="예: 아이들 생일"></div>' +
      '<div class="actions"><button class="btn" data-act="closeModal">닫기</button>' +
